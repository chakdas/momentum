name: Build the Android app

# Run it yourself from the Actions tab, or let a change to the app trigger it.
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      # Say plainly what is and is not here, so a failure is easy to read.
      - name: What is in the repo
        run: |
          echo "--- files at the top level ---"
          ls -la
          for f in index.html package.json capacitor.config.json sw.js; do
            if [ -f "$f" ]; then echo "FOUND    $f"; else echo "MISSING  $f"; fi
          done
          if [ ! -f package.json ] || [ ! -f capacitor.config.json ] || [ ! -f index.html ]; then
            echo ""
            echo "============================================================"
            echo " Stopping here. index.html, package.json and"
            echo " capacitor.config.json must all sit at the TOP of the repo,"
            echo " next to each other - not inside any folder."
            echo "============================================================"
            exit 1
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-24.04 already carries the Android SDK, so use that rather than
      # the setup-android action, which crashes inside sdkmanager.
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "No Android SDK on this runner."; exit 1
          fi
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "SDK is at $SDK"
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true
          echo "--- platforms ---";   ls "$SDK/platforms"   || true
          MGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$MGR" ]; then
            yes | "$MGR" --licenses > /dev/null 2>&1 || true
            echo "Licences accepted."
          fi

      # The key is made once and kept in the repo, so every later APK installs
      # over the previous one instead of making you uninstall first. If saving it
      # back is not allowed, the build carries on with a throwaway key rather
      # than failing - you still get an installable app.
      - name: Signing key
        run: |
          if [ -f keystore/momentum.jks ]; then
            echo "Key already in the repo - reusing it. Updates will install over the top."
            exit 0
          fi
          echo "No key yet - making one."
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/momentum.jks \
            -alias momentum \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass momentum -keypass momentum \
            -dname "CN=Momentum, OU=Personal, O=Momentum, L=Chennai, ST=Tamil Nadu, C=IN"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/momentum.jks
          git commit -m "Keep the signing key so updates install over each other [skip ci]" || true
          if git push; then
            echo "Key saved to the repo."
          else
            echo "::warning::Could not save the key back to the repo. The app still builds and installs."
            echo "::warning::To fix: Settings - Actions - General - Workflow permissions - Read and write permissions."
          fi

      # Capacitor wants the web files in one folder of their own.
      - name: Gather the web app into www/
        run: |
          mkdir -p www
          cp index.html www/
          for f in sw.js manifest.json; do [ -f "$f" ] && cp "$f" www/; done
          for f in *.png *.ico *.svg; do [ -f "$f" ] && cp "$f" www/; done
          echo "www/ now holds:"; ls -la www/

      - name: Install Capacitor
        run: npm install

      - name: Build the Android project
        run: |
          npx cap add android || true
          npx cap sync android

      # The status-bar icon has to be a flat white shape, so it gets drawn here
      # rather than reusing the colourful launcher icon.
      - name: Notification icon
        run: |
          set -e
          RES=android/app/src/main/res
          mkdir -p $RES/drawable-mdpi
          echo 'iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAAhUlEQVR4nM3SMQ6AIAwF0F9j4gm8gZMn8ARewRN4Ak/gCTyBJ/AEnsATOHkCJzdjHKQJGkIpuPkTEmhfaQsA/xoCoAWwA1gB9ClBDeAEcMs6AAWXoAJwPOBX0DKwAJgdeJ4C9AAWB14+AQ0jm5yADWOanIA1A3Yl4BvAI+ArIGXIjYDU/AJbmxnxv7Z1cwAAAABJRU5ErkJggg==' | base64 -d > $RES/drawable-mdpi/ic_stat_icon.png
          for D in hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/drawable-$D
            cp $RES/drawable-mdpi/ic_stat_icon.png $RES/drawable-$D/ic_stat_icon.png
          done
          echo "Icon written:"; ls -l $RES/drawable-*/ic_stat_icon.png

      # Use the app's own icon on the home screen instead of Capacitor's default.
      - name: Launcher icon
        run: |
          RES=android/app/src/main/res
          SRC=""
          for c in icon-512.png icon-192.png apple-touch-icon.png; do
            [ -f "$c" ] && SRC="$c" && break
          done
          if [ -z "$SRC" ]; then echo "No icon in the repo - keeping the default."; exit 0; fi
          echo "Using $SRC"
          set -- mdpi 48 hdpi 72 xhdpi 96 xxhdpi 144 xxxhdpi 192
          while [ $# -gt 0 ]; do
            D=$1; P=$2; shift 2
            mkdir -p $RES/mipmap-$D
            convert "$SRC" -resize ${P}x${P} $RES/mipmap-$D/ic_launcher.png || true
            convert "$SRC" -resize ${P}x${P} $RES/mipmap-$D/ic_launcher_round.png || true
            convert "$SRC" -resize ${P}x${P} $RES/mipmap-$D/ic_launcher_foreground.png || true
          done
          ls -l $RES/mipmap-xxhdpi/ || true

      # A release build needs a name people can read and a version that climbs,
      # so each APK is newer than the last in Android's eyes.
      - name: Name and number this build
        run: |
          VC=$(( 1000 + ${{ github.run_number }} ))
          VN="1.0.${{ github.run_number }}"
          echo "VN=$VN" >> $GITHUB_ENV
          sed -i "s/versionCode .*/versionCode $VC/"        android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VN\"/"    android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compile
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Signing after the build, rather than wiring it into Gradle - fewer moving
      # parts, and the same result.
      - name: Sign it
        run: |
          set -e
          BT=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -1)
          TOOLS="$ANDROID_HOME/build-tools/$BT"
          echo "Using build-tools $BT"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*unsigned*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          echo "Found $UNSIGNED"
          "$TOOLS/zipalign" -v -p 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign \
            --ks keystore/momentum.jks \
            --ks-key-alias momentum \
            --ks-pass pass:momentum \
            --key-pass pass:momentum \
            --out "Momentum-${{ env.VN }}.apk" aligned.apk
          "$TOOLS/apksigner" verify --print-certs "Momentum-${{ env.VN }}.apk"
          ls -lh Momentum-${{ env.VN }}.apk

      # Always kept here, whether or not the release below works.
      - name: Keep it on the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-apk
          path: Momentum-*.apk
          retention-days: 90

      # A release is the easy way to get it onto the phone: open the link,
      # tap the APK, install. If this is not allowed, the APK is still above.
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release create "v${{ env.VN }}" "Momentum-${{ env.VN }}.apk" \
               --title "Momentum ${{ env.VN }}" \
               --notes "Open this page on your phone and tap the APK to install."; then
            echo "Release made."
          elif gh release upload "v${{ env.VN }}" "Momentum-${{ env.VN }}.apk" --clobber; then
            echo "Added to the existing release."
          else
            echo "::warning::Could not publish a release. Download the APK from the Artifacts box on this page instead."
            echo "::warning::To fix: Settings - Actions - General - Workflow permissions - Read and write permissions."
          fi

      - name: Where to get it
        run: |
          echo "========================================================"
          echo " Momentum ${{ env.VN }} is built."
          echo " On your phone open:"
          echo "   github.com/${{ github.repository }}/releases"
          echo " and tap Momentum-${{ env.VN }}.apk"
          echo "========================================================"
