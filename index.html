<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#F7F6F1; --card:#FFFFFF; --ink:#15201B; --mut:#7E8A84; --line:#E8E7E0;
 --g1:#0F3D2E; --g2:#1C6B4F; --g3:#3E9B74; --g4:#7FC3A3; --g5:#C7E6D7;
 --mint:#E7F4EC; --red:#C3493F; --amber:#C98A2B; --blue:#3F7FA6;
 --sh:0 2px 14px rgba(21,32,27,.055);
 color-scheme:light;
}
body{background:var(--bg);color:var(--ink);
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
 letter-spacing:-.011em;padding-bottom:108px}
.wrap{max-width:440px;margin:0 auto;padding:0 16px}
.mic{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}

.top{padding:calc(14px + env(safe-area-inset-top)) 0 0}
.hello{display:flex;align-items:center;gap:11px}
.av{width:40px;height:40px;border-radius:50%;background:var(--g1);color:#fff;display:grid;place-items:center;
 font-weight:700;font-size:16px}
.hello b{font-size:17px;font-weight:700}
.hello i{font-style:normal;font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
 font-size:15px;color:var(--ink);flex:none}
.maintabs{display:flex;background:#ECEBE4;border-radius:999px;padding:4px;margin-top:16px}
.maintabs button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);
 padding:10px;border-radius:999px}
.maintabs button.on{background:var(--g1);color:#fff;box-shadow:0 3px 10px rgba(15,61,46,.25)}

.qbar{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);
 border-radius:999px;padding:5px 6px 5px 17px;box-shadow:var(--sh);margin-top:14px}
.qbar input{flex:1;min-width:0;border:0;margin:0;padding:11px 0;background:none;font:inherit;font-size:14px;
 border-radius:0}
.qbar input:focus{outline:none}
.qbar input::placeholder{color:#A9B2AD}
.qi{width:34px;height:34px;border-radius:50%;border:0;background:none;font-size:16px;color:var(--mut);flex:none}
.qgo{width:40px;height:40px;border-radius:50%;border:0;background:var(--g1);color:#fff;font-size:16px;
 flex:none;margin-left:3px;display:grid;place-items:center;line-height:1}
.qgo.rec{background:var(--red);animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(.9);opacity:.75}}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.sec{margin-top:20px}
.sechead{display:flex;align-items:center;margin-bottom:11px}
.sechead h2{font-size:15.5px;font-weight:700}
.sechead .more{margin-left:auto;font-size:12px;color:var(--mut)}
.big{font-size:32px;font-weight:800;letter-spacing:-.035em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pair .card .v{font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.trio .card{padding:13px}
.trio .v{font-size:17px;font-weight:700;margin-top:5px}

.subs{display:flex;gap:7px;overflow-x:auto;margin-top:14px;padding-bottom:3px}
.subs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;
 font:inherit;font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.subs button.on{background:var(--g1);color:#fff;border-color:var(--g1)}

.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;flex:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;font-size:11.5px;color:var(--mut);display:block;margin-top:2px}
.amt{font-size:14.5px;font-weight:700;white-space:nowrap}
.red{color:var(--red)}.grn{color:var(--g2)}
.bar{height:6px;background:#EFEEE8;border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.22,1,.36,1)}

.ban{display:flex;align-items:flex-start;gap:11px;background:var(--mint);border:1px solid #D2E8DC;
 border-radius:17px;padding:13px 15px;margin-top:13px;font-size:13px;line-height:1.5;color:#17543E}
.ban.warn{background:#FCF0EE;border-color:#F0D5D1;color:#8E2F27}
.ban.amber{background:#FDF5E7;border-color:#F0E2C4;color:#7A5410}
.ban.plain{background:var(--card);border-color:var(--line);color:var(--mut)}
.ban b{font-weight:700}
.ban .ic{font-size:17px;flex:none;line-height:1.3}

.ask{background:var(--g1);color:#fff;border-radius:20px;padding:16px;margin-top:13px}
.ask .q{font-size:14.5px;line-height:1.5;font-weight:500}
.ask .btns{display:flex;gap:9px;margin-top:13px}
.ask .btns button{flex:1;border:0;border-radius:12px;padding:11px;font:inherit;font-size:13px;font-weight:700}
.yes{background:#fff;color:var(--g1)}
.no{background:rgba(255,255,255,.17);color:#fff}
.later{background:rgba(255,255,255,.17);color:#fff;flex:0 0 72px!important}

.day{border:1px solid var(--line);border-radius:18px;background:var(--card);margin-top:11px;overflow:hidden;
 box-shadow:var(--sh)}
.dh{display:flex;align-items:center;gap:9px;padding:13px 15px;background:#FAFAF6;border-bottom:1px solid var(--line)}
.dh b{font-size:13.5px;font-weight:700}
.dh i{font-style:normal;font-size:11px;color:var(--mut)}
.dh .t{margin-left:auto;font-size:17px;font-weight:800;letter-spacing:-.02em}
.db{padding:3px 15px 9px}
.cl{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cl b{font-size:12.5px;font-weight:600;flex:none}
.cl span.bits{flex:1;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl span.a{font-size:13.5px;font-weight:700}

.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.leg div b{margin-left:auto;color:var(--ink);font-weight:700}

.meal{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:11px;overflow:hidden;
 box-shadow:var(--sh)}
.mh{display:flex;align-items:center;gap:11px;padding:13px 15px}
.mh .tile{width:36px;height:36px;border-radius:11px;font-size:16px}
.mh b{font-size:14px;font-weight:700}
.mh i{font-style:normal;font-size:11px;color:var(--mut);display:block;margin-top:2px}
.mh .k{margin-left:auto;font-size:15px;font-weight:800;white-space:nowrap}
.mh .add{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
 font-size:15px;color:var(--ink);flex:none;margin-left:4px}
.mb{padding:0 15px 11px}
.fi{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px}
.fi .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .fk{font-weight:700;font-size:12.5px}
.x{width:24px;height:24px;border-radius:50%;border:0;background:#F2F1EB;color:var(--mut);font-size:13px;flex:none}
.thumb{width:28px;height:28px;border-radius:7px;object-fit:cover;flex:none}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,246,241,.96);backdrop-filter:blur(14px);
 border-top:1px solid var(--line);display:flex;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;border:0;background:none;font:inherit;font-size:10px;color:#9FA8A3;display:grid;gap:4px;
 justify-items:center;font-weight:600}
nav button .g{font-size:17px;line-height:1}
nav button.on{color:var(--g1)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom));
 width:54px;height:54px;border-radius:50%;border:4px solid var(--bg);background:var(--g1);color:#fff;
 font-size:25px;line-height:1;box-shadow:0 8px 22px rgba(15,61,46,.35);z-index:31}

.sheet{position:fixed;inset:0;background:rgba(10,24,19,.45);z-index:50;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sbox{background:var(--bg);width:100%;max-width:440px;margin:0 auto;border-radius:24px 24px 0 0;
 padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.22,1,.36,1);
 max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(50px);opacity:.3}}
.grab{width:36px;height:4px;background:#DCDBD3;border-radius:99px;margin:0 auto 14px}
h3{font-size:19px;font-weight:700}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;font:inherit;
 margin-top:10px;background:var(--card);color:var(--ink)}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g1);color:#fff;font:inherit;
 font-weight:700;margin-top:13px}
.go.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.go.red{background:#FCF0EE;color:#8E2F27}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;font:inherit;font-size:12.5px}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}

.vo{position:fixed;inset:0;background:rgba(10,24,19,.86);z-index:70;display:none;flex-direction:column;
 align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff}
.vo.on{display:flex}
.vo .orb{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;
 font-size:36px;animation:breathe 1.4s infinite}
@keyframes breathe{50%{transform:scale(1.12);background:rgba(255,255,255,.26)}}
.vo .txt{margin-top:22px;font-size:17px;line-height:1.5;min-height:52px;max-width:330px}
.vo .hint{margin-top:10px;font-size:12px;opacity:.6;max-width:300px;line-height:1.5}
.vo .stop{margin-top:26px;border:0;border-radius:999px;background:#fff;color:var(--g1);font:inherit;
 font-weight:700;padding:13px 30px}
/* streaks */
.strow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.strk{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px 9px;
 text-align:center;box-shadow:var(--sh)}
.strk .fl{font-size:18px;display:block;line-height:1}
.strk b{display:block;font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.02em}
.strk i{font-style:normal;display:block;font-size:9.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.strk.live{background:linear-gradient(160deg,#0F3D2E,#1C6B4F);border-color:transparent;color:#fff}
.strk.live i{color:rgba(255,255,255,.7)}
.strk.cold{opacity:.75}
.pips{display:flex;gap:3px;justify-content:center;margin-top:7px}
.pips span{width:6px;height:6px;border-radius:50%;background:#E4E3DC}
.pips span.y{background:var(--g3)}
.strk.live .pips span{background:rgba(255,255,255,.25)}
.strk.live .pips span.y{background:#9FD9BC}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.calhd{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.calhd b{font-size:14px;font-weight:700;flex:1;text-align:center}
.calhd button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
 font-size:15px;color:var(--ink);flex:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{font-size:9.5px;color:var(--mut);text-align:center;font-weight:600;padding-bottom:3px}
.cd{aspect-ratio:1;border:0;background:none;border-radius:11px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;color:var(--ink);padding:0}
.cd.pad{visibility:hidden}
.cd .pd{width:5px;height:5px;border-radius:50%;background:transparent}
.cd.good{background:var(--mint);font-weight:700}
.cd.good .pd{background:var(--g2)}
.cd.over{background:#FCF0EE;font-weight:700;color:#8E2F27}
.cd.over .pd{background:var(--red)}
.cd.part{background:#F3F2EC}
.cd.part .pd{background:var(--mut)}
.cd.now{box-shadow:inset 0 0 0 2px var(--g1)}
.callegend{display:flex;gap:12px;margin-top:11px;font-size:10.5px;color:var(--mut);flex-wrap:wrap}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend i{width:8px;height:8px;border-radius:50%;display:block}

/* animated donut + macro row */
.sl{stroke-dasharray:0 var(--c);animation:sweep .9s cubic-bezier(.3,1,.4,1) forwards}
@keyframes sweep{to{stroke-dasharray:var(--l) var(--c)}}
.ctr{animation:pop .5s .34s cubic-bezier(.22,1.3,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
.macro{display:flex;gap:9px;margin-top:12px}
.macro>div{flex:1;background:#FAFAF6;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.macro b{display:block;font-size:17px;font-weight:800;margin-top:3px}
.inst{display:flex;align-items:center;gap:11px;background:var(--g1);color:#fff;border-radius:18px;
 padding:14px 15px;margin-top:14px}
.inst .ic{font-size:19px;flex:none}
.inst .tx{flex:1;font-size:12.5px;line-height:1.45}
.inst button{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-size:12.5px;font-weight:700;
 background:#fff;color:var(--g1);flex:none}
.inst .skip{background:rgba(255,255,255,.17);color:#fff;padding:10px 11px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab">+</button>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>
<div class="vo" id="vo">
  <div class="orb">&#127897;</div>
  <div class="txt" id="votxt">Listening…</div>
  <div class="hint" id="vohint"></div>
  <button class="stop" onclick="stopListening()">Done</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">

function load(){
 try{var raw=localStorage.getItem(KEY);
  if(!raw){
   var old=localStorage.getItem('momentum.v2');
   if(old){var o=JSON.parse(old),s=clone(SEED);
    Object.keys(o).forEach(function(k){if(s[k]!==undefined)s[k]=o[k];});
    Object.keys(SEED.health).forEach(function(j){if(s.health[j]===undefined)s.health[j]=SEED.health[j];});
    s.settings.ready=1;
    return s;}
   return clone(SEED);}
  var d=JSON.parse(raw);
  Object.keys(SEED).forEach(function(k){
   if(d[k]===undefined)d[k]=clone(SEED[k]);
   else if(k==='health'||k==='settings'||k==='ai')
    Object.keys(SEED[k]).forEach(function(j){if(d[k][j]===undefined)d[k][j]=SEED[k][j];});
  });
  /* someone who already has data never sees the welcome screen */
  if(!d.settings.ready&&((d.tx||[]).length||(d.debts||[]).length||(d.accounts||[]).length>1||
     Object.keys(d.food||{}).length))d.settings.ready=1;
  return d;}catch(e){return clone(SEED);}
}

/* ---------- helpers ---------- */
function N(n){return Math.round(Math.abs(n)).toLocaleString('en-IN');}
function R(n){return '₹'+N(n);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function col(c){return (CC[c]||CC.Other)[0];}
function ico(c){return (CC[c]||CC.Other)[1];}
function p2(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function ym(){return today().slice(0,7);}
function dayAgo(n){var d=new Date();d.setDate(d.getDate()-n);
 return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dshort(d){return new Date(d+'T12:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function monthName(){return new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
function acc(id){return D.accounts.filter(function(a){return a.id===id;})[0]||D.accounts[0];}
function src(id){return D.sources.filter(function(s){return s.id===id;})[0]||D.sources[D.sources.length-1];}
function ordinal(n){if(n>3&&n<21)return 'th';return ['th','st','nd','rd'][n%10]||'th';}
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ================= FINANCE MODEL ================= */
function balance(id){
 var b=acc(id).open;
 D.tx.forEach(function(t){
  if(t.type==='in'&&t.acct===id)b+=t.amount;
  else if(t.type==='out'&&t.acct===id)b-=t.amount;
  else if(t.type==='move'){if(t.from===id)b-=t.amount;if(t.to===id)b+=t.amount;}});
 return b;
}
function liquid(){return D.accounts.reduce(function(s,a){return s+balance(a.id);},0);}
function inDay(d){return D.tx.filter(function(t){return t.date===d&&t.type==='in';})
 .reduce(function(s,t){return s+t.amount;},0);}
function outDay(d){return D.tx.filter(function(t){return t.date===d&&t.type==='out';})
 .reduce(function(s,t){return s+t.amount;},0);}
function range(span){
 if(span==='day')return [today(),today()];
 if(span==='week')return [dayAgo(6),today()];
 if(span==='month')return [ym()+'-01',today()];
 return [dayAgo(29),today()];
}
function txIn(span,type){
 var r=range(span);
 return D.tx.filter(function(t){return t.date>=r[0]&&t.date<=r[1]&&(!type||t.type===type);});
}
function sum(l){return l.reduce(function(s,t){return s+t.amount;},0);}
function groupBy(list,key){
 var by={};list.forEach(function(t){var k=t[key]||'Other';by[k]=(by[k]||0)+t.amount;});
 return Object.keys(by).map(function(k){return {name:k,value:by[k]};})
  .sort(function(a,b){return b.value-a.value;});
}
function debtStats(d){
 var paid=Math.max(0,(d.total||0)-(d.left||0));
 var months=d.emi>0?Math.ceil(d.left/d.emi):null;
 var span=months==null?'no monthly amount':months<=1?'final payment':
  months<12?months+' months left':
  (Math.floor(months/12)+' yr'+(months%12?' '+(months%12)+' mo':'')+' left');
 var end=null;
 if(months){var e=new Date();e.setMonth(e.getMonth()+months);
  end=e.toLocaleDateString('en-IN',{month:'short',year:'numeric'});}
 return {paid:paid,pct:d.total?Math.round(paid/d.total*100):0,months:months,span:span,end:end};
}
var CLOSE_HOLD=2*60*60*1000;   /* a closed debt stays visible, marked Closed, for two hours */
function liveDebts(){return D.debts.filter(function(d){return !d.closed;});}
function holdingDebts(){return D.debts.filter(function(d){
 return d.closed&&Date.now()-d.closed<CLOSE_HOLD;});}
function clearedDebts(){return D.debts.filter(function(d){
 return d.closed&&Date.now()-d.closed>=CLOSE_HOLD;});}
function closeDebt(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];if(!d||d.closed)return;
 if(!confirm('Close '+d.name+' by paying the remaining '+R(d.left)+' now?'))return;
 var amt=d.left,tid=nid();
 if(amt>0)D.tx.push({id:tid,date:today(),amount:amt,type:'out',cat:'Debt',
  note:d.name+' \u2014 closed',acct:D.accounts[0].id});
 d.closedAmount=amt;d.closedTx=tid;d.closed=Date.now();d.left=0;
 var m=ym();D.paid[m]=D.paid[m]||{};
 if(!D.paid[m][id])D.paid[m][id]={date:today(),txid:tid,amount:0};
 save();draw();
 toast(d.name+' closed. '+R(amt)+' recorded \u2014 it leaves the list in two hours.');
}
function reopenDebt(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];if(!d||!d.closed)return;
 D.tx=D.tx.filter(function(t){return t.id!==d.closedTx;});
 d.left=d.closedAmount||0;
 var m=ym();if(D.paid[m]&&D.paid[m][id]&&D.paid[m][id].amount===0)delete D.paid[m][id];
 delete d.closed;delete d.closedAmount;delete d.closedTx;
 save();draw();toast(d.name+' is back on the list.');
}

function lastWeight(){
 var ks=Object.keys(D.hlog).filter(function(k){return D.hlog[k].weight;}).sort();
 return ks.length?D.hlog[ks[ks.length-1]].weight:D.health.weightStart;
}
function bmr(){var H=D.health;return Math.round(10*lastWeight()+6.25*H.height-5*H.age+5);}
function tdee(){return Math.round(bmr()*1.35);}
function eatTarget(){
 var H=D.health;
 if(!H.autoTarget&&H.eat)return H.eat;
 return Math.max(1500,Math.round((tdee()-600)/50)*50);
}

function actOf(d){return D.act[d]||[];}
function eaten(d,meal){return foodOf(d).filter(function(f){return !meal||f.meal===meal;})

function protein(d,meal){return Math.round(foodOf(d).filter(function(f){return !meal||f.meal===meal;})

/* ================= PARSING ================= */
function clean(t){
 return String(t||'').toLowerCase().replace(/[!?;:]/g,' ')
  .replace(/[.,]/g,function(m,off,s){
   var p=s.charAt(off-1),n=s.charAt(off+1);
   return (/\d/.test(p)&&/\d/.test(n))?m:' ';})
  .replace(/\s+/g,' ').trim();
}
function numBefore(txt,at){
 var pre=txt.slice(Math.max(0,at-22),at);
 var m=pre.match(/([\d]+(?:\.\d+)?)\s*$/);
 if(m)return Number(m[1]);
 m=pre.match(new RegExp('([\\d]+(?:\\.\\d+)?)\\s+(?:'+UNITW+')\\s*$'));
 if(m)return Number(m[1]);
 var ws=pre.trim().split(' ');
 var w=ws[ws.length-1];
 if(NUMW[w]!==undefined)return NUMW[w];
 if(new RegExp('^(?:'+UNITW+')$').test(w)&&ws.length>1&&NUMW[ws[ws.length-2]]!==undefined)
  return NUMW[ws[ws.length-2]];
 return null;
}
function parseFoodText(text){
 var t=clean(text),found=[],used=[];
 FIDX.forEach(function(e){
  var at=0;
  while(true){
   var i=t.indexOf(e.n,at);
   if(i<0)break;
   at=i+e.n.length;
   var okL=i===0||!/[a-z஀-௿]/.test(t.charAt(i-1));
   var okR=at>=t.length||!/[a-z஀-௿]/.test(t.charAt(at));
   if(!okL||!okR)continue;
   var clash=used.some(function(u){return i<u[1]&&at>u[0];});
   if(clash)continue;
   used.push([i,at]);
   var f=FOODS[e.i],q=numBefore(t,i);
   found.push({pos:i,name:f[0],qty:q==null?f[4]:q,unit:f[3],per:f[2],pro:f[5]||0});
  }
 });
 found.sort(function(a,b){return a.pos-b.pos;});
 return found;
}
function mealFromText(text){
 var t=clean(text);
 if(/breakfast|காலை|kaalai|tiffin|டிபன்/.test(t))return 'breakfast';
 if(/lunch|மதிய|madhiya|mathiya/.test(t))return 'lunch';
 if(/dinner|இரவு|iravu|night/.test(t))return 'dinner';
 if(/snack|ஸ்நாக்|evening|மாலை/.test(t))return 'snacks';
 return null;
}
function parseActivity(text){
 var t=clean(text),m;
 m=t.match(/(?:steps?|அடி|நடை)\s*([\d,]+)/)||t.match(/([\d,]+)\s*(?:steps?|அடி)/);
 if(m)return {kind:'steps',value:Number(m[1].replace(/,/g,''))};
 m=t.match(/(?:treadmill|டிரெட்மில்)\s*([\d.]+)/)||t.match(/([\d.]+)\s*(?:min|mins|minutes)\s*(?:treadmill|டிரெட்மில்)/);
 if(m)return {kind:'treadmill',value:Number(m[1])};
 m=t.match(/(?:walk|walked|walking|நடந்தேன்|nadanthen)\s*(?:for\s*)?([\d.]+)/)
  ||t.match(/([\d.]+)\s*(?:min|mins|minutes|நிமிடம்|நிமிடங்கள்)\s*(?:walk|நடந்தேன்)/);
 if(m)return {kind:'walk',value:Number(m[1])};
 m=t.match(/(?:swim|swimming|நீச்சல்)\s*([\d.]+)/);
 if(m)return {kind:'swim',value:Number(m[1])};
 m=t.match(/(?:cycle|cycling|சைக்கிள்)\s*([\d.]+)/);
 if(m)return {kind:'cycle',value:Number(m[1])};
 return null;
}
var SPEND_W='spent|spend|paid|gave|bought|செலவ\\S*|கொடுத்த\\S*|வாங்கின\\S*|selavu|kuduthen|vanginen';
var EARN_W='earned|earn|got|received|income|சம்பாதி\\S*|கிடைத்த\\S*|கிடைச்ச\\S*|sampathi\\S*|kedacha\\S*|kedachu|vanthuchu';
function stripMoneyWords(s){
 s=s.split(' ').filter(function(w){return NUMW[w]===undefined;}).join(' ');
 return s.replace(/(^|\s)(rs|rupees?|rupais?|ரூபாய்|ரூ|inr)(?=\s|$)/gi,' ')
  .replace(new RegExp('\\b('+SPEND_W+'|'+EARN_W+')\\b','gi'),' ')
  .replace(/\b(for|on|at|to|க்கு|ku|i|this|that|it|today|was|the|a|an|my)\b/gi,' ')
  .replace(/\s+/g,' ').trim();
}
function parseMoney(text){
 var t=clean(text),amt=null,m;
 m=t.match(/(?:rs\.?|₹|rupees?|ரூபாய்|ரூ)\s*([\d,]+(?:\.\d+)?)/)
  ||t.match(/([\d,]+(?:\.\d+)?)\s*(?:rs|rupees?|rupai|ரூபாய்|ரூ)/);
 if(m)amt=Number(m[1].replace(/,/g,''));
 if(amt==null){m=t.match(/(\d[\d,]*(?:\.\d+)?)/);if(m)amt=Number(m[1].replace(/,/g,''));}
 if(amt==null&&/rs\b|\u20B9|rupees?|rupai|ரூபாய்|ரூ\b|செலவ|சம்பாதி/.test(t)){
  var ws=t.split(' '),acc2=0,got=false;
  for(var wi=0;wi<ws.length;wi++){
   var v=NUMW[ws[wi]];
   if(v===undefined)continue;
   got=true;
   if(v>=100&&acc2)acc2=acc2*v;else acc2+=v;
  }
  if(got&&acc2>0)amt=acc2;
 }
 if(!amt)return null;
 var isEarn=new RegExp('\\b('+EARN_W+')\\b').test(t);
 var what=stripMoneyWords(t).replace(/[\d,.]+/g,' ').replace(/\s+/g,' ').trim();
 if(isEarn){
  var s=matchSource(t);
  return {kind:'earn',amount:amt,src:s.id,
   note:what.replace(new RegExp(s.name,'i'),'').trim()};
 }
 if(/petrol|fuel|diesel|பெட்ரோல்|டீசல்/.test(t))
  return {kind:'spend',amount:amt,cat:'Fuel',note:'Petrol'};
 return {kind:'spend',amount:amt,cat:guessCat(what),note:what||'Spent'};
}
function matchSource(txt){
 var t=clean(txt);
 for(var i=0;i<D.sources.length;i++){
  var s=D.sources[i];
  if(t.indexOf(s.id)>-1||t.indexOf(s.name.toLowerCase())>-1)return s;
 }
 if(/salary|சம்பளம்|sambalam|office/.test(t))return src('salary');
 if(/ரேபிடோ|bike|ride|drop/.test(t))return src('rapido');
 if(/ஊபர்/.test(t))return src('uber');
 if(/ஸ்விக்கி/.test(t))return src('swiggy');
 return src('other');
}
var GUESS={Food:['tea','coffee','lunch','dinner','breakfast','snack','mess','hotel','juice','biryani','meal','food',
  'டீ','காபி','சாப்பாடு','ஹோட்டல்','உணவு'],
 Travel:['auto','bus','train','metro','cab','share','ticket','toll','parking','ஆட்டோ','பஸ்','ரயில்','டிக்கெட்'],
 Fuel:['petrol','fuel','diesel','gas','பெட்ரோல்','டீசல்'],
 Groceries:['milk','vegetable','grocery','provision','rice','fruit','பால்','காய்கறி','அரிசி','பழம்'],

function guessCat(txt){

 for(var c in GUESS)for(var i=0;i<GUESS[c].length;i++)if(t.indexOf(GUESS[c][i])>-1)return c;

function parseHealthSimple(text){

 if(m)return {kind:'weight',value:Number(m[1])};
 m=t.match(/(?:water|தண்ணீர்|thanni)\s*([\d,]+)/)||t.match(/([\d,]+)\s*ml\b/);

/* the one router every typed or spoken line goes through */
function handle(text,thumb){
 var t=clean(text),d=today();
 if(!t)return null;

 var ac=parseActivity(t);
 if(ac){var k=actKcal(ac);addAct(d,ac.kind,ac.value,k);
  return actLabel(ac)+' — about '+k+' kcal burned';}

 var hs=parseHealthSimple(t);
 if(hs&&MODE==='health'){
  if(hs.kind==='weight'){hSet(d,'weight',hs.value);return 'Weight '+hs.value+' kg saved';}
  hSet(d,'water',waterOf(d)+hs.value);return hs.value+' ml water added';
 }

 var foods=parseFoodText(t);
 var moneyWord=new RegExp('\\b('+SPEND_W+'|'+EARN_W+')\\b').test(t)
  ||/rs\.?\s*\d|₹|ரூபாய்|rupees?|rupai/.test(t);

 if(foods.length&&(MODE==='health'||!moneyWord)){
  var drinksOnly=foods.every(function(f){return /tea|coffee|juice|milk|buttermilk|water|coconut|drink/i.test(f.name);});
  var meal=mealFromText(t)||(drinksOnly?'drinks':mealNow());
  var tot=0,names=[];
  foods.forEach(function(f){
   var kc=f.per*f.qty;tot+=kc;
   addFood(d,meal,f.name,f.qty,f.unit,kc,thumb,f.pro*f.qty);thumb=null;
   names.push((f.qty!==1?f.qty+' ':'')+f.name.toLowerCase());});
  var mn=MEALS.filter(function(m){return m.id===meal;})[0].name.toLowerCase();
  return names.join(', ')+' → '+Math.round(tot)+' kcal in '+mn;
 }
 if(hs){
  if(hs.kind==='weight'){hSet(d,'weight',hs.value);return 'Weight '+hs.value+' kg saved';}
  hSet(d,'water',waterOf(d)+hs.value);return hs.value+' ml water added';
 }
 var money=parseMoney(t);
 if(money){
  if(money.kind==='earn'){
   D.tx.push({id:nid(),date:d,amount:money.amount,type:'in',src:money.src,
    note:money.note||'',acct:D.accounts[0].id});save();
   return R(money.amount)+' from '+src(money.src).name+' added';
  }
  D.tx.push({id:nid(),date:d,amount:money.amount,type:'out',cat:money.cat,
   note:money.note,acct:D.accounts[0].id});save();
  return R(money.amount)+' on '+String(money.note||money.cat).toLowerCase()+' added';
 }
 return null;
}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, recText='';
/* A phone can only listen in one language at a time, so the app chooses for him:
   it starts from the phone's own language and quietly switches when it stops understanding. */
function voiceLang(){
 if(D.settings.lang==='ta')return 'ta-IN';
 if(D.settings.lang==='en')return 'en-IN';
 if(D.settings.heard==='ta')return 'ta-IN';
 if(D.settings.heard==='en')return 'en-IN';
 return /^ta/i.test(navigator.language||'')?'ta-IN':'en-IN';
}
function heardOk(){D.settings.heard=voiceLang()==='ta-IN'?'ta':'en';D.settings.misses=0;save();}
function heardMiss(){
 D.settings.misses=(D.settings.misses||0)+1;
 if(D.settings.misses>=2&&D.settings.lang==='auto'){
  D.settings.heard=voiceLang()==='ta-IN'?'en':'ta';D.settings.misses=0;save();return true;}
 save();return false;
}
function listen(){
 if(!SR){toast('Voice needs Chrome on Android or Safari 16+. Type it instead.');return;}
 recText='';
 document.getElementById('votxt').textContent='Listening…';
 document.getElementById('vohint').textContent=
  voiceLang()==='ta-IN'?'தமிழில் பேசுங்கள் — "நாலு இட்லி", "ஐம்பது ரூபாய் டீ"'
                        :'Tamil or English — "four idli and sambar", "fifty rupees tea"';
 document.getElementById('vo').classList.add('on');
 var gb=document.getElementById('qgo');if(gb)gb.classList.add('rec');
 try{
  rec=new SR();
  rec.lang=voiceLang();
  rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=function(e){
   var txt='';
   for(var i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
   recText=txt;
   document.getElementById('votxt').textContent=txt||'Listening…';
  };
  rec.onerror=function(e){
   document.getElementById('vo').classList.remove('on');
   toast(e.error==='not-allowed'?'Microphone permission is off for this page.'
        :e.error==='no-speech'?'Did not catch that.':'Voice error: '+e.error);
  };
  rec.onend=function(){if(document.getElementById('vo').classList.contains('on'))stopListening();};
  rec.start();
 }catch(err){document.getElementById('vo').classList.remove('on');toast('Could not start the microphone.');}
}
function stopListening(){
 try{if(rec)rec.stop();}catch(e){}
 document.getElementById('vo').classList.remove('on');
 var gb2=document.getElementById('qgo');if(gb2)gb2.classList.remove('rec');
 var t=recText.trim();recText='';
 if(!t)return;
 var r=handle(t);
 if(r){heardOk();draw();toast(r);return;}
 if(hasKey()){heardOk();aiText(t);return;}
 toast(heardMiss()?'Did not catch that — switching language. Tap the mic and say it again.'
                  :'Did not catch that. Say it again, or type it.');
}

/* ================= AI — optional, the user's own key ================= */
var MODELS=['gemini-3.8-flash','gemini-2.5-flash','gemini-flash-latest'];
function hasKey(){return !!(D.ai.key&&D.ai.key.length>10);}
/* Inside Claude's artifact frame the browser blocks every call to an outside service.
   Served from an ordinary web address, or opened as a file, the same call goes through. */
function blocked(){
 try{return /claude\.ai|anthropic/i.test(location.hostname)||location.ancestorOrigins&&
  location.ancestorOrigins.length>0;}catch(e){return false;}
}
function gemini(parts,cb){
 if(!hasKey()){cb(null,'no-key');return;}
 var i=0;
 (function tryOne(){
  if(i>=MODELS.length){cb(null,'No model accepted the request.');return;}
  var model=MODELS[i++];
  fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{
   method:'POST',
   headers:{'Content-Type':'application/json','x-goog-api-key':D.ai.key},
   body:JSON.stringify({contents:[{parts:parts}],
    generationConfig:{responseMimeType:'application/json',temperature:0.2}})
  }).then(function(r){
   if(r.status===404||r.status===400){var e=new Error('retry');e.retry=true;throw e;}
   if(!r.ok)return r.text().then(function(x){throw new Error('HTTP '+r.status+' '+x.slice(0,110));});
   return r.json();
  }).then(function(j){
   var txt=((((j.candidates||[])[0]||{}).content||{}).parts||[{}])[0].text||'';
   try{cb(JSON.parse(txt),null);}catch(e){cb(null,'The AI replied in a shape I could not read.');}
  }).catch(function(e){
   if(e&&e.retry)return tryOne();
   var m=(e&&e.message)||'';
   if(/failed to fetch|networkerror|load failed/i.test(m))
    cb(null,blocked()?'This page is not allowed to call Google from where it is hosted. '+
      'Your key is fine \u2014 see the note under AI key in Setup.'
     :'No internet, or the connection was refused.');
   else cb(null,m||'Could not reach the AI.');
  });
 })();
}
function aiText(text){
 if(!hasKey()){toast('Did not understand that. Add your AI key in Setup for free wording.');return;}
 toast('Thinking…');
 gemini([{text:
  'You read a short note from an Indian user, written in Tamil, English or both. Decide what it records and '+
  'return ONLY JSON.\n'+
  'Money spent: {"kind":"spend","amount":N,"category":"Food|Travel|Fuel|Groceries|Bills|Health|Shopping|Fun|Family|Other","note":"..."}\n'+
  'Money earned: {"kind":"earn","amount":N,"source":"salary|rapido|uber|swiggy|other","note":"..."}\n'+
  'Food eaten: {"kind":"food","meal":"breakfast|lunch|snacks|dinner|drinks","items":[{"name":"...","qty":N,"unit":"...","kcal":N,"protein_g":N}]}\n'+
  'Exercise: {"kind":"activity","what":"steps|walk|treadmill|swim|cycle","value":N}\n'+
  'Body weight: {"kind":"weight","value":N}\n'+
  'Water: {"kind":"water","ml":N}\n'+
  'None of these: {"kind":"none"}\n'+
  'Use realistic South Indian portion calories. Money amounts are Indian rupees.\n\nNote: '+text}],
  function(j,err){
   if(err||!j)return toast(err==='no-key'?'Add your AI key in Setup.':('Could not read that — '+err));
   applyAi(j,null);
  });
}
function applyAi(j,thumb){
 var d=today();
 if(j.kind==='spend'&&j.amount){
  D.tx.push({id:nid(),date:d,amount:Number(j.amount),type:'out',

 if(!f)return;
 shrink(f,function(full,thumb){photoFlow(full,thumb);});

function shrink(file,cb){
 var img=new Image(),url=URL.createObjectURL(file);
 img.onload=function(){
  function render(max,q){
   var s=Math.min(1,max/Math.max(img.width,img.height));
   var c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   return c.toDataURL('image/jpeg',q);
  }
  var full=render(900,0.72),thumb=render(110,0.5);
  URL.revokeObjectURL(url);cb(full,thumb);
 };
 img.onerror=function(){URL.revokeObjectURL(url);toast('Could not read that photo.');};
 img.src=url;
}
function photoFlow(full,thumb){
 var meal=pendingMeal||mealNow();pendingMeal=null;_thumb=thumb;
 if(!hasKey()){
  openSheet('<div class="grab"></div><h3>Photo saved</h3>'+
   '<div style="font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.5">'+

   'is read automatically. For now, type what is on the plate.</div>'+
   '<img src="'+thumb+'" style="width:88px;height:88px;border-radius:14px;object-fit:cover;margin-top:13px">'+
   '<input id="pf" placeholder="e.g. 4 idli sambar chutney">'+
   '<button class="go" onclick="photoManual(\''+meal+'\')">Add</button>'+
   '<button class="go ghost" onclick="closeSheet()">Cancel</button>');
  return;
 }
 openSheet('<div class="grab"></div><h3>Reading the plate…</h3>'+
  '<img src="'+thumb+'" style="width:88px;height:88px;border-radius:14px;object-fit:cover;margin-top:13px">'+
  '<div id="pst" style="font-size:13px;color:var(--mut);margin-top:14px">Sending to the AI. A few seconds.</div>');
 gemini([
  {text:'You estimate calories from a photo of a meal, usually South Indian home or restaurant food. '+
   'Identify each item, estimate a realistic portion (count of idli, dosa or chapati; cups of rice; ml for a cup '+
   'or glass) and its calories. Return ONLY JSON: '+
   '{"items":[{"name":"...","qty":N,"unit":"...","kcal":N,"protein_g":N}],"total":N,"confidence":"high|medium|low","note":"one short line"}. '+
   'Be realistic, not generous. If the photo is not food return {"items":[],"total":0,"confidence":"low","note":"not food"}.'},
  {inline_data:{mime_type:'image/jpeg',data:full.split(',')[1]}}
 ],function(j,err){
  var el=document.getElementById('pst');
  if(err||!j){if(el)el.innerHTML='<span style="color:var(--red)">'+esc(err||'No answer')+'</span>';return;}
  showPhotoResult(j,meal,thumb);
 });
}

 if(!foods.length){toast('Could not match that — try "4 idli sambar".');return;}

 foods.forEach(function(f){addFood(today(),meal,f.name,f.qty,f.unit,f.per*f.qty,th,f.pro*f.qty);th=null;});

function txRow(t){
 if(t.type==='move')
  return '<div class="row" onclick="editTx(\''+t.id+'\')"><div class="tile" style="background:#F0EFE9">↔</div>'+
   '<div class="nm"><b>Moved money</b><i>'+esc(acc(t.from).name)+' → '+esc(acc(t.to).name)+' · '+dshort(t.date)+'</i></div>'+
   '<div class="amt">'+R(t.amount)+'</div></div>';
 if(t.type==='in'){
  var s=src(t.src);
  return '<div class="row" onclick="editTx(\''+t.id+'\')"><div class="tile" style="background:var(--mint)">'+s.icon+'</div>'+
   '<div class="nm"><b>'+esc(t.note||s.name)+'</b><i>'+esc(s.name)+' · '+dshort(t.date)+'</i></div>'+
   '<div class="amt grn">+'+R(t.amount)+'</div></div>';
 }
 return '<div class="row" onclick="editTx(\''+t.id+'\')">'+
  '<div class="tile" style="background:'+col(t.cat)+'1A;color:'+col(t.cat)+'">'+ico(t.cat)+'</div>'+
  '<div class="nm"><b>'+esc(t.note||t.cat)+'</b><i>'+esc(t.cat)+' · '+dshort(t.date)+'</i></div>'+
  '<div class="amt red">−'+R(t.amount)+'</div></div>';
}
function finReport(){
 var h='<div class="wrap">'+header('Money reports');
 h+='<div class="subs">'+[['spending','Spending'],['income','Income'],['days','Day by day'],['budgets','Budgets']]
  .map(function(s){return '<button class="'+(SUB===s[0]?'on':'')+'" onclick="SUB=\''+s[0]+'\';draw()">'+s[1]+'</button>';}).join('')+'</div>';
 h+='<div class="subs">'+[['day','Today'],['week','7 days'],['month','This month'],['30','30 days']]
  .map(function(s){return '<button class="'+(SPAN===s[0]?'on':'')+'" onclick="SPAN=\''+s[0]+'\';draw()">'+s[1]+'</button>';}).join('')+'</div>';
 h+=SUB==='income'?incomeView():SUB==='days'?daysView():SUB==='budgets'?budgetView():spendingView();
 return h+'<div style="height:16px"></div></div>';
}
function spanName(){return SPAN==='day'?'today':SPAN==='week'?'last 7 days':SPAN==='month'?monthName():'last 30 days';}
function spanDays(){return SPAN==='day'?1:SPAN==='week'?7:SPAN==='month'?new Date().getDate():30;}
function spendingView(){
 var list=txIn(SPAN,'out'),tot=sum(list),cats=groupBy(list,'cat');
 var h='<div class="sec"><div class="sechead"><h2>Your spending</h2><span class="more">'+spanName()+'</span></div>'+
  donut(cats,tot,'Total spent');
 if(!cats.length)return h+'<div class="card" style="margin-top:12px;color:var(--mut);font-size:13px">Nothing recorded in this period.</div></div>';
 h+='<div class="leg">'+cats.map(function(c){
  return '<div><span class="dot" style="background:'+col(c.name)+'"></span>'+esc(c.name)+
   '<b>'+Math.round(c.value/tot*100)+'%</b></div>';}).join('')+'</div>';
 var b=D.settings.budget*spanDays();
 if(b>0)h+= tot<=b
  ? '<div class="ban"><span class="ic">🌿</span><div><b>You\'re '+Math.round((b-tot)/b*100)+
    '% under budget.</b><br>'+R(b-tot)+' of your '+R(b)+' allowance is still unspent.</div></div>'
  : '<div class="ban warn"><span class="ic">!</span><div><b>'+R(tot-b)+' over.</b><br>Budget for this period was '+R(b)+'.</div></div>';
 h+='</div><div class="sec"><div class="sechead"><h2>Spending trend</h2></div>'+trendBars()+'</div>';
 h+='<div class="sec"><div class="list">'+cats.map(function(c){
  var p=Math.round(c.value/tot*100),n=list.filter(function(t){return t.cat===c.name;}).length;
  return '<div class="row"><div class="tile" style="background:'+col(c.name)+'1A;color:'+col(c.name)+'">'+ico(c.name)+'</div>'+
   '<div class="nm"><b>'+esc(c.name)+'</b><i>'+p+'% of total · '+n+' entr'+(n===1?'y':'ies')+'</i>'+
   '<div class="bar"><i style="width:'+p+'%;background:'+col(c.name)+'"></i></div></div>'+
   '<div class="amt">'+R(c.value)+'</div></div>';}).join('')+'</div></div>';
 return h;
}
function incomeView(){
 var list=txIn(SPAN,'in'),tot=sum(list),bySrc=groupBy(list,'src');
 var h='<div class="sec"><div class="sechead"><h2>Your income</h2><span class="more">'+spanName()+'</span></div>'+
  donut(bySrc.map(function(s){return {name:src(s.name).name,value:s.value};}),tot,'Total earned',true);
 if(!tot)return h+'<div class="card" style="margin-top:12px;color:var(--mut);font-size:13px">'+
  'Nothing recorded. Say or type <b>earned 300 rapido</b>.</div></div>';
 h+='<div class="list" style="margin-top:14px">'+bySrc.map(function(s){
  var so=src(s.name),p=Math.round(s.value/tot*100);
  return '<div class="row"><div class="tile" style="background:var(--mint)">'+so.icon+'</div>'+
   '<div class="nm"><b>'+esc(so.name)+'</b><i>'+p+'% of income</i>'+
   '<div class="bar"><i style="width:'+p+'%;background:var(--g2)"></i></div></div>'+
   '<div class="amt grn">'+R(s.value)+'</div></div>';}).join('')+'</div>';
 var g=gigNet(SPAN);
 if(g.earn)h+='<div class="ban"><span class="ic">🏍</span><div>Riding brought in <b>'+R(g.earn)+
  '</b> and petrol cost '+R(g.fuel)+'. You actually kept <b>'+R(g.net)+'</b>.</div></div>';
 return h+'</div>';
}
function daysView(){
 var r=range(SPAN);
 var pool=D.tx.filter(function(t){return t.date>=r[0]&&t.date<=r[1]&&t.type!=='move';});
 var byDay={};pool.forEach(function(t){(byDay[t.date]=byDay[t.date]||[]).push(t);});
 var days=Object.keys(byDay).sort().reverse();
 var h='<div class="sec"><div class="sechead"><h2>Day by day</h2><span class="more">'+days.length+' days</span></div>';
 if(!days.length)h+='<div class="card" style="color:var(--mut);font-size:13px">Nothing in this period yet.</div>';
 days.forEach(function(d){
  var list=byDay[d],outs=list.filter(function(t){return t.type==='out';}),
      ins=list.filter(function(t){return t.type==='in';});
  var o=sum(outs),i=sum(ins);
  h+='<div class="day"><div class="dh"><b>'+dshort(d)+'</b><i>'+
   (i?'+'+R(i)+' in':'')+(i&&o?' · ':'')+(o?R(o)+' out':'')+'</i>'+
   '<div class="t '+(i-o>=0?'grn':'red')+'">'+(i-o>=0?'+':'−')+R(i-o)+'</div></div><div class="db">'+
   groupBy(ins,'src').map(function(s){
    var notes=ins.filter(function(t){return t.src===s.name;}).map(function(t){return t.note||'';}).filter(Boolean);
    return '<div class="cl"><span class="dot" style="background:var(--g3)"></span><b>'+esc(src(s.name).name)+'</b>'+
     '<span class="bits">'+esc(notes.join(', ')||'earned')+'</span><span class="a grn">+'+R(s.value)+'</span></div>';}).join('')+
   groupBy(outs,'cat').map(function(c){
    var notes=outs.filter(function(t){return t.cat===c.name;}).map(function(t){return t.note||'';}).filter(Boolean);
    return '<div class="cl"><span class="dot" style="background:'+col(c.name)+'"></span><b>'+esc(c.name)+'</b>'+
     '<span class="bits">'+esc(notes.join(', '))+'</span><span class="a">'+R(c.value)+'</span></div>';}).join('')+
   '</div></div>';
 });
 return h+'</div>';
}
function budgetView(){
 return '<div class="sec"><div class="sechead"><h2>Budgets</h2><span class="more">'+monthName()+'</span></div>'+
  '<div class="list">'+budgetRows().map(function(b){
   var tone=b.used>b.limit?'var(--red)':b.fast?'var(--amber)':'var(--g2)';
   return '<div class="row"><div class="tile" style="background:'+col(b.cat)+'1A;color:'+col(b.cat)+'">'+ico(b.cat)+'</div>'+
    '<div class="nm"><b>'+esc(b.cat)+'</b><i>'+R(b.used)+' of '+R(b.limit)+
    (b.used>b.limit?' · '+R(-b.left)+' over':b.fast?' · heading for '+R(b.projected):'')+'</i>'+
    '<div class="bar"><i style="width:'+Math.min(100,b.pct)+'%;background:'+tone+'"></i></div></div>'+
    ring(b.pct,tone)+'</div>';}).join('')+'</div></div>';
}
function ring(pct,tone){
 var r=16,c=2*Math.PI*r,p=Math.min(100,pct);
 return '<svg viewBox="0 0 42 42" width="42" height="42" style="flex:none">'+
  '<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="#EFEEE8" stroke-width="4"/>'+
  '<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="'+tone+'" stroke-width="4" stroke-linecap="round"'+
  ' stroke-dasharray="'+(c*p/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 21 21)"/>'+
  '<text x="21" y="25" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15201B">'+pct+'%</text></svg>';
}
function adonut(slices,tot,label,big,sub){
 if(!tot)return '<div class="card" style="text-align:center;padding:34px;color:var(--mut);font-size:13px">'+
  'Nothing to chart yet.</div>';
 var r=72,sw=27,C=2*Math.PI*r,off=0,arcs='';
 slices.forEach(function(sl,i){
  var L=Math.max(0,sl.value/tot*C-2);
  arcs+='<circle class="sl" cx="100" cy="100" r="'+r+'" fill="none" stroke="'+sl.color+'" '+
   'stroke-width="'+sw+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 100 100)" '+
   'style="--l:'+L.toFixed(1)+';--c:'+C.toFixed(1)+';animation-delay:'+(i*0.08).toFixed(2)+'s"></circle>';
  off+=sl.value/tot*C;
 });
 return '<div class="card" style="text-align:center;padding:16px">'+
  '<svg viewBox="0 0 200 200" style="width:208px;max-width:100%">'+arcs+
  '<g class="ctr"><text x="100" y="93" text-anchor="middle" font-size="10.5" fill="#7E8A84">'+label+'</text>'+
  '<text x="100" y="117" text-anchor="middle" font-size="23" font-weight="800" fill="#15201B">'+big+'</text>'+
  (sub?'<text x="100" y="134" text-anchor="middle" font-size="10" fill="#7E8A84">'+sub+'</text>':'')+
  '</g></svg></div>';
}
var SHADES=['#0F3D2E','#1C6B4F','#3E9B74','#7FC3A3','#A8D6BF','#C7E6D7','#5E8F79','#2E7D5B'];
function donut(cats,tot,label,alt){
 return adonut(cats.map(function(c,i){return {value:c.value,color:alt?SHADES[i%8]:col(c.name)};}),
  tot,label,R(tot));
}
function trendBars(){
 var n=SPAN==='month'?new Date().getDate():SPAN==='30'?30:7,days=[];
 for(var i=n-1;i>=0;i--){var d=dayAgo(i);days.push({d:d,v:outDay(d)});}
 var max=Math.max.apply(null,days.map(function(x){return x.v;}))||1;
 return '<div class="card"><div style="display:flex;align-items:flex-end;gap:'+(n>10?'3':'7')+'px;height:118px">'+
  days.map(function(x,i){
   return '<div style="flex:1;text-align:center">'+
    '<div style="height:'+Math.max(4,x.v/max*104)+'px;border-radius:6px;background:'+
    (i===days.length-1?'var(--g1)':'var(--g5)')+';animation:gw .5s '+(i*0.015)+'s both"></div>'+
    (n<=7?'<div style="font-size:9.5px;color:var(--mut);margin-top:5px">'+
     new Date(x.d+'T12:00').toLocaleDateString('en-IN',{weekday:'narrow'})+'</div>':'')+'</div>';
  }).join('')+'</div></div>';
}
function debtPage(){
 var td=new Date().getDate(),tot=totalDebt();
 var live=liveDebts(),hold=holdingDebts(),done=clearedDebts();
 var allTotal=live.reduce(function(s,d){return s+d.total;},0),paid=allTotal-tot;
 var h='<div class="wrap">'+header('What you owe');

 h+='<div class="sec"><div class="card" style="background:var(--g1);color:#fff;border-color:transparent">'+
  '<div class="mic" style="color:rgba(255,255,255,.6)">Still owed</div>'+
  '<div class="big" style="margin-top:5px">'+R(tot)+'</div>'+
  '<div class="bar" style="background:rgba(255,255,255,.18);margin-top:13px">'+
   '<i style="width:'+Math.round(paid/Math.max(1,allTotal)*100)+'%;background:var(--g4)"></i></div>'+
  '<div style="font-size:12.5px;opacity:.78;margin-top:9px">'+R(paid)+' of '+R(allTotal)+' cleared \u00B7 '+
   R(committed())+' a month'+(done.length?' \u00B7 '+done.length+' loan'+(done.length===1?'':'s')+' closed':'')+
   '</div></div></div>';

 if(!dues().length)
  h+='<div class="ban plain"><span class="ic">✦</span><div>Nothing here yet. Add the loans and the bills '+
   'you pay every month, and the app will chase you for them and work out when each one clears.</div></div>';
 h+='<div style="display:flex;gap:8px;margin-top:14px">'+
  '<button class="chip" style="flex:1;text-align:center" onclick="addDebtSheet()">+ Loan</button>'+
  '<button class="chip" style="flex:1;text-align:center" onclick="addBillSheet()">+ Monthly bill</button></div>';

 if(dues().length)
 h+='<div class="sec"><div class="sechead"><h2>'+monthName()+'</h2><span class="more">'+
  dues().filter(function(o){return isPaid(o.id);}).length+' of '+dues().length+' paid</span></div><div class="list">'+
  dues().map(function(o){
   var p=isPaid(o.id),late=!p&&o.day<td;
   return '<div class="row">'+
    '<div class="tile" style="background:'+(p?'var(--mint)':late?'#FCF0EE':'#F2F1EB')+';color:'+
     (p?'var(--g2)':late?'var(--red)':'var(--mut)')+';font-weight:700;font-size:'+(p||late?'16px':'13px')+'">'+
     (p?'\u2713':late?'!':o.day)+'</div>'+
    '<div class="nm" onclick="'+(o.kind==='debt'?'debtDetail(\''+o.id+'\')':'billSheet(\''+o.id+'\')')+'">'+
     '<b style="'+(p?'opacity:.45':'')+'">'+esc(o.name)+'</b><i>'+
     (p?'paid \u2014 taken off the balance':late?'overdue since the '+o.day+ordinal(o.day):
       'due the '+o.day+ordinal(o.day))+(o.estimate?' \u00B7 estimate':'')+'</i></div>'+
    '<div style="text-align:right"><div class="amt '+(p?'':'red')+'" style="'+(p?'opacity:.4':'')+'">'+
      R(o.amount)+'</div>'+
     '<button class="chip" style="padding:5px 11px;font-size:11px;margin-top:5px;'+
      (p?'background:var(--mint);border-color:#D2E8DC;color:var(--g2)':'')+'" '+
      'onclick="togglePaid(\''+o.id+'\')">'+(p?'Paid \u2713':'I have paid')+'</button></div></div>';
  }).join('')+'</div></div>';

 if(live.length||hold.length)
 h+='<div class="sec"><div class="sechead"><h2>Each debt</h2><span class="more">smallest first</span></div>';
 live.concat(hold).sort(function(x,y){
   if(!!x.closed!==!!y.closed)return x.closed?1:-1;return x.left-y.left;})
  .forEach(function(d){
  var st=debtStats(d),closed=!!d.closed;
  var mins=closed?Math.max(1,Math.round((CLOSE_HOLD-(Date.now()-d.closed))/60000)):0;
  h+='<div class="day"'+(closed?' style="opacity:.75"':'')+'>'+
   '<div class="dh" onclick="debtDetail(\''+d.id+'\')">'+
    '<b>'+esc(d.name)+'</b><i>'+
    (closed?'closed \u00B7 leaves the list in '+(mins>59?'about an hour':mins+' min'):
     d.estimate?'estimate':st.span)+'</i>'+
    '<div class="t">'+(closed?'<span class="grn" style="font-size:14px">Closed \u2713</span>':R(d.left))+'</div></div>'+
   '<div class="db" style="padding:13px 15px">'+
   (closed
    ? '<div style="font-size:12.5px;color:var(--mut)">'+
      (d.closedAmount?R(d.closedAmount)+' paid off to close it.':'Finished with the last monthly payment.')+
      '</div><button class="chip" style="margin-top:11px" onclick="reopenDebt(\''+d.id+'\')">'+
      'Undo \u2014 put it back</button>'
    : '<div class="bar" style="margin-top:0"><i style="width:'+st.pct+'%;background:var(--g2)"></i></div>'+
      '<div style="display:flex;gap:15px;margin-top:11px">'+
       '<div><div class="mic">Paid</div><div class="grn" style="font-size:15px;font-weight:700;margin-top:3px">'+
        R(st.paid)+'</div></div>'+
       '<div><div class="mic">Left</div><div class="red" style="font-size:15px;font-weight:700;margin-top:3px">'+
        R(d.left)+'</div></div>'+
       '<div><div class="mic">Monthly</div><div style="font-size:15px;font-weight:700;margin-top:3px">'+
        R(d.emi)+'</div></div>'+
       '<div style="margin-left:auto;text-align:right"><div class="mic">Done</div>'+
        '<div style="font-size:15px;font-weight:700;margin-top:3px">'+st.pct+'%</div></div></div>'+
      '<div style="display:flex;gap:8px;margin-top:13px">'+
       '<button class="chip" style="flex:1;text-align:center;'+
        (isPaid(d.id)?'background:var(--mint);border-color:#D2E8DC;color:var(--g2)':'')+'" '+
        'onclick="payMonth(\''+d.id+'\')">'+
        (isPaid(d.id)?'Monthly paid \u2713':'Monthly '+R(d.emi))+'</button>'+
       '<button class="chip" style="flex:1;text-align:center;background:var(--g1);color:#fff;border-color:var(--g1)" '+
        'onclick="closeDebt(\''+d.id+'\')">Close '+R(d.left)+'</button></div>')+
   '</div></div>';
 });
 if(!live.length&&!hold.length&&done.length)
  h+='<div class="sec"><div class="card" style="color:var(--g2);font-size:13px;font-weight:600">'+
   'Every loan is closed. Nothing owed.</div></div>';
 if(live.length||hold.length)h+='</div>';

 if(done.length){
  var cleared=done.reduce(function(s,d){return s+d.total;},0);
  h+='<div class="sec"><div class="sechead"><h2>Closed for good</h2><span class="more">'+
   R(cleared)+' cleared</span></div><div class="list">'+done.map(function(d){
    return '<div class="row" onclick="debtDetail(\''+d.id+'\')">'+
     '<div class="tile" style="background:var(--mint);color:var(--g2)">\u2713</div>'+
     '<div class="nm"><b>'+esc(d.name)+'</b><i>closed '+
      new Date(d.closed).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+'</i></div>'+
     '<div class="amt grn">'+R(d.total)+'</div></div>';}).join('')+'</div></div>';
 }
 return h+'<div style="height:16px"></div></div>';
}
function debtDetail(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];if(!d)return;
 var s=debtStats(d),hist=[];
 Object.keys(D.paid).sort().forEach(function(m){if(D.paid[m][id])hist.push({m:m,r:D.paid[m][id]});});
 var sched='';
 if(s.months&&d.emi>0){
  var left=d.left,rows=[];
  for(var i=1;i<=Math.min(s.months,12);i++){
   var pay=Math.min(d.emi,left);left-=pay;
   var dt=new Date();dt.setMonth(dt.getMonth()+i);
   rows.push('<div class="cl"><b>'+dt.toLocaleDateString('en-IN',{month:'short',year:'2-digit'})+'</b>'+
    '<span class="bits">after paying '+R(pay)+'</span><span class="a">'+R(left)+'</span></div>');}
  sched='<div class="mic" style="margin-top:18px">What is left, month by month</div>'+rows.join('')+
   (s.months>12?'<div style="font-size:12px;color:var(--mut);margin-top:8px">…and '+(s.months-12)+' more months.</div>':'');
 }
 openSheet('<div class="grab"></div><h3>'+esc(d.name)+'</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:3px">'+esc(d.lender||'')+
   (d.estimate?' · figures are estimates':'')+'</div>'+
  '<div class="pair" style="margin-top:14px">'+
   '<div class="card"><div class="mic">Paid so far</div><div class="v grn">'+R(s.paid)+'</div></div>'+
   '<div class="card"><div class="mic">Still owed</div><div class="v red">'+R(d.left)+'</div></div></div>'+
  '<div class="pair" style="margin-top:10px">'+
   '<div class="card"><div class="mic">Every month</div><div class="v">'+R(d.emi)+'</div></div>'+
   '<div class="card"><div class="mic">Time left</div><div class="v" style="font-size:16px">'+s.span+'</div></div></div>'+
  (s.end?'<div class="ban"><span class="ic">◷</span><div>At '+R(d.emi)+' a month this clears around <b>'+
   s.end+'</b>, paid on the '+d.day+ordinal(d.day)+'.</div></div>':'')+
  (d.note?'<div class="ban amber"><span class="ic">!</span><div>'+esc(d.note)+'</div></div>':'')+
  (hist.length?'<div class="mic" style="margin-top:18px">Payments ticked here</div>'+
    hist.reverse().map(function(x){return '<div class="cl"><b>'+x.m+'</b><span class="bits">'+esc(x.r.date||'')+
     '</span><span class="a">'+R(x.r.amount||d.emi)+'</span></div>';}).join('')
   :'<div style="font-size:12.5px;color:var(--mut);margin-top:16px">No payments ticked yet.</div>')+
  sched+
  (d.closed
   ? '<button class="go ghost" onclick="closeSheet();reopenDebt(\''+id+'\')">Undo the close</button>'
   : '<button class="go" onclick="closeSheet();payMonth(\''+id+'\')">'+
      (isPaid(id)?'This month is already paid':'Pay this month \u2014 '+R(d.emi))+'</button>'+
     '<button class="go ghost" onclick="closeSheet();closeDebt(\''+id+'\')">'+
      'Close it with '+R(d.left)+'</button>')+
  '<button class="go ghost" onclick="editDebt(\''+id+'\')">Correct these figures</button>'+
  '<button class="go ghost" onclick="closeSheet()">Done</button>');
}
function editDebt(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];
 openSheet('<div class="grab"></div><h3>'+esc(d.name)+'</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:3px">Put in what the lender\'s app says.</div>'+

function saveDebt(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];
 d.total=Number(document.getElementById('dt').value)||d.total;
 d.left=Number(document.getElementById('dl').value);
 d.emi=Number(document.getElementById('de').value)||0;
 d.day=Math.min(31,Math.max(1,Number(document.getElementById('dd').value)||d.day));
 if(d.left>d.total)d.total=d.left;
 d.estimate=false;save();closeSheet();draw();
}
function togglePaid(id,silent){
 var m=ym();D.paid[m]=D.paid[m]||{};
 var o=dues().filter(function(x){return x.id===id;})[0];if(!o)return;
 if(D.paid[m][id]){
  if(!silent&&!confirm('Mark '+o.name+' as unpaid again?'))return;
  var rc=D.paid[m][id];
  D.tx=D.tx.filter(function(t){return t.id!==rc.txid;});
  var dd=D.debts.filter(function(x){return x.id===id;})[0];
  if(dd)dd.left=dd.left+(rc.amount||0);
  delete D.paid[m][id];
 }else{
  var tid=nid();
  D.tx.push({id:tid,date:today(),amount:o.amount,type:'out',cat:o.kind==='debt'?'Debt':'Bills',
   note:o.name,acct:D.accounts[0].id});
  var d2=D.debts.filter(function(x){return x.id===id;})[0];
  if(d2)d2.left=Math.max(0,d2.left-o.amount);
  D.paid[m][id]={date:today(),txid:tid,amount:o.amount};
 }
 save();draw();
}

/* ================= STREAKS ================= */
function streakOf(test){
 var n=0,i=0,live=test(today());
 if(!live)i=1;
 while(i<400){if(!test(dayAgo(i)))break;n++;i++;}
 return {n:n,live:live,risk:!live&&n>0};
}
function last7(test){var a=[];for(var i=6;i>=0;i--)a.push(test(dayAgo(i)));return a;}
var TESTS={
 food:   function(d){return foodOf(d).length>0;},
 onPlan: function(d){return foodOf(d).length>0&&eaten(d)<=eatTarget();},
 moved:  function(d){return actOf(d).length>0;},
 money:  function(d){return D.tx.some(function(t){return t.date===d;});},
 budget: function(d){return D.tx.some(function(t){return t.date===d;})&&outDay(d)<=D.settings.budget;},
 income: function(d){return inDay(d)>0;}
};
function strkCard(test,label,icon){
 var st=streakOf(test),pips=last7(test);
 return '<div class="strk '+(st.live&&st.n?'live':st.n?'cold':'')+'">'+
  '<span class="fl">'+(st.n?icon:'\u00B7')+'</span><b>'+st.n+'</b><i>'+label+'</i>'+
  '<div class="pips">'+pips.map(function(y){return '<span class="'+(y?'y':'')+'"></span>';}).join('')+
  '</div></div>';
}
function strkNudge(test,what,verb){
 var st=streakOf(test);
 if(st.risk&&st.n>=2)
  return '<div class="ban amber"><span class="ic">\uD83D\uDD25</span><div>Your <b>'+st.n+'-day '+what+
   ' streak</b> is still alive \u2014 '+verb+' today and it carries on.</div></div>';
 if(st.live&&st.n>=7&&st.n%7===0)
  return '<div class="ban"><span class="ic">\uD83C\uDFC6</span><div><b>'+st.n+' days straight.</b> That is '+
   (st.n/7)+' full week'+(st.n/7>1?'s':'')+' without breaking it.</div></div>';
 if(st.live&&st.n>=3)
  return '<div class="ban"><span class="ic">\uD83D\uDD25</span><div><b>'+st.n+
   ' days in a row.</b> Do not break it tomorrow.</div></div>';
 return '';
}

var CAL=null;

 CAL=d.getFullYear()+'-'+p2(d.getMonth()+1);draw();
}
function dayState(d){
 if(!foodOf(d).length&&!actOf(d).length)return '';
 if(!foodOf(d).length)return 'part';
 return eaten(d)<=eatTarget()?'good':'over';
}
function calendar(){
 var q=calMonth().split('-'),y=Number(q[0]),mo=Number(q[1]);
 var first=new Date(y,mo-1,1),dim=new Date(y,mo,0).getDate(),lead=first.getDay(),cells='';
 ['S','M','T','W','T','F','S'].forEach(function(w){cells+='<div class="wd">'+w+'</div>';});
 for(var i=0;i<lead;i++)cells+='<button class="cd pad"></button>';
 for(var dn=1;dn<=dim;dn++){
  var ds=y+'-'+p2(mo)+'-'+p2(dn);
  cells+='<button class="cd '+dayState(ds)+(ds===today()?' now':'')+'" onclick="dayReport(\''+ds+'\')">'+
   dn+'<span class="pd"></span></button>';
 }
 return '<div class="cal"><div class="calhd">'+
  '<button onclick="shiftMonth(-1)">\u2039</button>'+

  ' stroke-linecap="round" stroke-dasharray="'+(c*pct/100).toFixed(1)+' '+c.toFixed(1)+

  '<text x="44" y="49" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">'+pct+'%</text></svg>';

function spark(vals){
 var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),rg=Math.max(0.5,max-min);

  (84-(v-min)/rg*64-10).toFixed(1);}).join(' ');
 return '<svg viewBox="0 0 280 90" style="width:100%"><polyline points="'+pts+
  '" fill="none" stroke="var(--g2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
  '<text x="0" y="12" font-size="10" fill="#7E8A84">'+max+' kg</text>'+
  '<text x="243" y="88" font-size="10" fill="#7E8A84">'+vals[vals.length-1]+' kg</text></svg>';
}

  '<div class="list">'+D.accounts.map(function(a){
   return '<div class="row" onclick="editAccount(\''+a.id+'\')"><div class="tile" style="background:#F2F1EB">🏦</div>'+
    '<div class="nm"><b>'+esc(a.name)+'</b></div><div class="amt">'+R(balance(a.id))+'</div></div>';}).join('')+
  '</div></div>';
 h+='<div class="sec"><div class="sechead"><h2>Voice</h2><span class="more">'+
  (D.settings.lang==='auto'?'automatic':D.settings.lang==='ta'?'Tamil':'English')+'</span></div>'+
  '<div class="card"><div style="font-size:12.5px;color:var(--mut);line-height:1.5">'+
  'Left on automatic the app picks the language itself and switches when it stops understanding you. '+
  'Pin one only if it keeps guessing wrong.</div><div class="chips">'+
  [['auto','Automatic'],['en','English'],['ta','தமிழ்']].map(function(x){
   return '<button class="chip'+(D.settings.lang===x[0]?' on':'')+'" onclick="setLang(\''+x[0]+'\')">'+
    x[1]+'</button>';}).join('')+'</div></div></div>';

 h+='<div class="sec"><div class="sechead"><h2>Daily budget</h2></div><div class="card">'+
  '<input type="number" value="'+D.settings.budget+'" onchange="D.settings.budget=Number(this.value)||400;save();draw()">'+
  '</div></div>';
 h+='<div class="sec"><div class="sechead"><h2>Category limits</h2></div><div class="list">'+
  D.budgets.map(function(b,i){
   return '<div class="row"><div class="tile" style="background:'+col(b.cat)+'1A;color:'+col(b.cat)+'">'+ico(b.cat)+'</div>'+
    '<div class="nm"><b>'+esc(b.cat)+'</b></div>'+
    '<input type="number" value="'+b.limit+'" style="width:92px;margin:0;text-align:right;padding:9px" '+
    'onchange="D.budgets['+i+'].limit=Number(this.value)||0;save();draw()"></div>';}).join('')+'</div></div>';
 h+='<div class="sec"><div class="sechead"><h2>AI key</h2><span class="more">'+
  (hasKey()?'added':'not set')+'</span></div><div class="card">'+
  (blocked()?'<div class="ban amber" style="margin-top:0"><span class="ic">!</span><div>'+
   '<b>The photo reader cannot work here.</b> While the app runs inside Claude, the browser blocks it from '+
   'calling Google \u2014 nothing to do with your key. Put the app on its own web address and it works. '+
   'Everything else on this page is unaffected.</div></div>':'')+
  '<div style="font-size:12.5px;color:var(--mut);line-height:1.5">Needed for two things only: reading calories '+
  'from a plate photo, and understanding wording the app cannot match on its own. Get a free key at '+
  '<b>aistudio.google.com</b> → Get API key, then paste it here. It is saved in this browser alone — '+
  'never type it into a chat or send it to anyone.</div>'+
  '<input type="password" id="aik" placeholder="'+(hasKey()?'•••••• (saved)':'Paste your key')+'">'+
  '<button class="go" onclick="saveKey()">Save key</button>'+
  (hasKey()?'<button class="go ghost" onclick="testKey()">Test it</button>'+
   '<button class="go red" onclick="D.ai.key=\'\';save();draw();toast(\'Key removed\')">Remove key</button>':'')+
  '</div></div>';
 h+='<div class="sec"><div class="sechead"><h2>Backup</h2></div><div class="card">'+
  '<div style="font-size:12.5px;color:var(--mut)">Everything lives in this browser. Clearing browsing data wipes it.</div>'+
  '<button class="go" onclick="exportData()">Copy my data</button>'+
  '<button class="go ghost" onclick="importData()">Restore a backup</button>'+
  '<button class="go ghost" onclick="exportCsv()">Export CSV</button>'+
  '<button class="go red" onclick="wipe()">Erase everything</button></div></div>';
 return h+'<div style="height:16px"></div></div>';
}
function saveKey(){
 var v=(document.getElementById('aik')||{}).value||'';
 if(v.trim().length<10)return toast('That does not look like a key.');
 D.ai.key=v.trim();save();draw();toast('Key saved on this device only');
}
function testKey(){
 toast('Testing…');
 gemini([{text:'Reply with exactly {"ok":true}'}],function(j,err){
  toast(err?('Not working: '+err):(j&&j.ok?'Key works.':'Key answered, but oddly.'));});
}
function editAccount(id){
 var a=acc(id);
 openSheet('<div class="grab"></div><h3>'+esc(a.name)+'</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:4px">What does the bank app say right now?</div>'+
  '<input id="bv" type="number" inputmode="decimal" value="'+Math.round(balance(id))+'">'+
  '<button class="go" onclick="setBal(\''+id+'\')">Set it</button>'+
  '<button class="go red" onclick="removeAccount(\''+id+'\')">Remove this account</button>'+
  '<button class="go ghost" onclick="closeSheet()">Cancel</button>');
}
function setBal(id){
 var want=Number(document.getElementById('bv').value);if(isNaN(want))return;
 var a=acc(id);a.open=a.open+(want-balance(id));save();closeSheet();draw();
}
function openAdd(){
 openSheet('<div class="grab"></div><h3>Add</h3>'+
  '<div class="chips" id="kind">'+[['out','Spent'],['in','Earned'],['move','Moved']]
   .map(function(k,i){return '<button class="chip'+(i===0?' on':'')+'" data-k="'+k[0]+
    '" onclick="pickKind(this)">'+k[1]+'</button>';}).join('')+'</div>'+
  '<input id="amt" type="number" inputmode="decimal" placeholder="Amount ₹">'+
  '<div id="extra"></div>'+
  '<button class="go" onclick="saveEntry()">Save</button>'+
  '<button class="go ghost" onclick="closeSheet()">Cancel</button>');
 pickKind(document.querySelector('#kind .chip'));
 setTimeout(function(){var a=document.getElementById('amt');if(a)a.focus();},170);
}
function pickKind(btn){
 Array.prototype.forEach.call(document.querySelectorAll('#kind .chip'),function(b){b.classList.toggle('on',b===btn);});
 var k=btn.dataset.k,e=document.getElementById('extra');
 var accSel=function(id,label){return '<div class="mic" style="margin-top:15px">'+label+'</div><select id="'+id+'">'+
  D.accounts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join('')+'</select>';};
 if(k==='out')e.innerHTML='<input id="note" placeholder="On what? tea, auto, petrol…">'+
  '<div class="mic" style="margin-top:15px">Category</div><select id="cat">'+
  CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select>'+accSel('acct','Paid from');
 else if(k==='in')e.innerHTML='<div class="mic" style="margin-top:15px">Earned from</div><select id="srcsel">'+
  D.sources.map(function(s){return '<option value="'+s.id+'">'+s.icon+'  '+esc(s.name)+'</option>';}).join('')+'</select>'+
  '<input id="note" placeholder="Note (optional)">'+accSel('acct','Into');
 else e.innerHTML=accSel('from','From')+accSel('to','To');
 e.dataset.kind=k;
}
function saveEntry(){
 var amount=Number(document.getElementById('amt').value);
 if(!amount||amount<=0)return alert('Enter an amount first.');
 var k=document.getElementById('extra').dataset.kind;
 var note=(document.getElementById('note')||{}).value||'';
 if(k==='move'){
  var f=document.getElementById('from').value,t2=document.getElementById('to').value;
  if(f===t2)return alert('Pick two different accounts.');
  D.tx.push({id:nid(),date:today(),amount:amount,type:'move',from:f,to:t2,note:note});
 }else if(k==='in')
  D.tx.push({id:nid(),date:today(),amount:amount,type:'in',
   src:document.getElementById('srcsel').value,note:note,acct:document.getElementById('acct').value});
 else
  D.tx.push({id:nid(),date:today(),amount:amount,type:'out',
   cat:document.getElementById('cat').value,note:note,acct:document.getElementById('acct').value});
 save();closeSheet();draw();
}
function editTx(id){
 var t=D.tx.filter(function(x){return x.id===id;})[0];if(!t)return;
 openSheet('<div class="grab"></div><h3>'+esc(t.note||t.cat||'Entry')+'</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:4px">'+R(t.amount)+' · '+dshort(t.date)+'</div>'+
  (t.type==='out'?'<div class="mic" style="margin-top:15px">Category</div><select id="c2">'+
   CATS.map(function(c){return '<option'+(c===t.cat?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'+
   '<button class="go" onclick="recat(\''+id+'\')">Change category</button>':'')+
  '<button class="go red" onclick="delTx(\''+id+'\')">Delete</button>'+
  '<button class="go ghost" onclick="closeSheet()">Close</button>');
}
function recat(id){var t=D.tx.filter(function(x){return x.id===id;})[0];
 t.cat=document.getElementById('c2').value;save();closeSheet();draw();}
function delTx(id){if(!confirm('Delete this entry?'))return;
 D.tx=D.tx.filter(function(t){return t.id!==id;});save();closeSheet();draw();}

function exportData(){
 openSheet('<div class="grab"></div><h3>Your data</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:4px">Copy this somewhere safe.</div>'+
  '<textarea rows="8" style="font-size:11px" onclick="this.select()">'+esc(JSON.stringify(D))+'</textarea>'+
  '<button class="go" onclick="copyOut(this)">Copy</button>'+
  '<button class="go ghost" onclick="closeSheet()">Close</button>');
}
function copyOut(b){var ta=document.querySelector('#sbox textarea');ta.select();
 try{document.execCommand('copy');b.textContent='Copied';}catch(e){b.textContent='Select and copy manually';}}
function importData(){
 openSheet('<div class="grab"></div><h3>Restore</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:4px">This replaces everything here.</div>'+
  '<textarea id="imp" rows="8" style="font-size:11px" placeholder="Paste your backup"></textarea>'+
  '<button class="go" onclick="doImport(0)">Restore</button>'+
  '<button class="go ghost" onclick="closeSheet()">Cancel</button>');
}
function doImport(first){
 try{
  var raw=(document.getElementById('imp')||{}).value||'';
  var d=JSON.parse(raw);
  if(!d.accounts||!d.tx)throw new Error('That does not look like a Momentum backup.');
  D=d;
  Object.keys(SEED).forEach(function(k){
   if(D[k]===undefined)D[k]=clone(SEED[k]);
   else if(k==='health'||k==='settings'||k==='ai')
    Object.keys(SEED[k]).forEach(function(j){if(D[k][j]===undefined)D[k][j]=SEED[k][j];});});
  D.settings.ready=1;
  save();closeSheet();chrome(true);draw();
  toast(first?'Restored \u2014 everything is back.':'Backup restored.');
 }catch(e){alert('Could not restore: '+e.message);}
}
function exportCsv(){
 var rows=[['Date','In/Out','Category or Source','Note','Amount','Account']].concat(
  D.tx.map(function(t){return [t.date,t.type,t.type==='in'?src(t.src).name:(t.cat||'move'),
   '"'+(t.note||'')+'"',t.amount,t.acct?acc(t.acct).name:''];}));
 rows.push([]);rows.push(['Date','Meal','Food','Qty','Kcal']);
 Object.keys(D.food).sort().forEach(function(d){D.food[d].forEach(function(f){
  rows.push([d,f.meal,'"'+f.name+'"',f.qty,f.kcal]);});});
 rows.push([]);rows.push(['Date','Activity','Value','Kcal']);
 Object.keys(D.act).sort().forEach(function(d){D.act[d].forEach(function(a){
  rows.push([d,a.kind,a.value,a.kcal]);});});
 openSheet('<div class="grab"></div><h3>CSV</h3>'+
  '<textarea rows="8" style="font-size:11px" onclick="this.select()">'+
   esc(rows.map(function(r){return r.join(',');}).join('\n'))+'</textarea>'+
  '<button class="go" onclick="copyOut(this)">Copy</button>'+
  '<button class="go ghost" onclick="closeSheet()">Close</button>');
}
function wipe(){
 if(!confirm('Erase everything and start again?'))return;
 if(!confirm('Really? This cannot be undone.'))return;
 D=clone(SEED);save();closeSheet();chrome(false);draw();
}

function openSheet(html){
 document.getElementById('sbox').innerHTML=html;
 document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}
document.getElementById('sheet').onclick=function(e){if(e.target.id==='sheet')closeSheet();};
function toast(msg){
 var t=document.createElement('div');t.textContent=msg;
 t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:122px;background:#15201B;'+
  'color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;'+
  'box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:86vw;text-align:center;line-height:1.4';
 document.body.appendChild(t);
 setTimeout(function(){t.style.transition='opacity .3s';t.style.opacity='0';
  setTimeout(function(){t.remove();},320);},2400);
}
var st=document.createElement('style');
st.textContent='@keyframes gw{from{transform:scaleY(0);transform-origin:bottom}}';
document.head.appendChild(st);

/* ---- installing it as a real app ---- */
var INSTALL=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();INSTALL=e;draw();});
window.addEventListener('appinstalled',function(){INSTALL=null;draw();});
function standalone(){
 return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
}
function installBanner(){
 if(!INSTALL||standalone()||D.settings.noInstall)return '';
 return '<div class="inst"><span class="ic">\u2B07</span>'+
  '<div class="tx"><b>Install Momentum</b><br>Own icon, no browser bar, works without signal.</div>'+
  '<button onclick="doInstall()">Install</button>'+
  '<button class="skip" onclick="D.settings.noInstall=1;save();draw()">Later</button></div>';
}
function doInstall(){
 if(!INSTALL)return;
 INSTALL.prompt();
 INSTALL.userChoice.then(function(r){
  INSTALL=null;draw();
  if(r&&r.outcome==='accepted')toast('Installed \u2014 open it from your home screen.');});
}
if('serviceWorker' in navigator&&!blocked()&&
   (location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
 window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});

paintNav();draw();
</script>
