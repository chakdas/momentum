<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Momentum</title>
<meta name="theme-color" content="#F7F6F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#F7F6F1; --card:#FFFFFF; --ink:#15201B; --mut:#7E8A84; --line:#E8E7E0;
 --g1:#0F3D2E; --g2:#1C6B4F; --g3:#3E9B74; --g4:#7FC3A3; --g5:#C7E6D7;
 --mint:#E7F4EC; --red:#C3493F; --amber:#C98A2B; --blue:#3F7FA6;
 --sh:0 2px 14px rgba(21,32,27,.055);
 color-scheme:light;
}
body{background:var(--bg);color:var(--ink);
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
 letter-spacing:-.011em;padding-bottom:108px}
.wrap{max-width:440px;margin:0 auto;padding:0 16px}
.mic{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}

.top{padding:calc(14px + env(safe-area-inset-top)) 0 0}
.hello{display:flex;align-items:center;gap:11px}
.av{width:40px;height:40px;border-radius:50%;background:var(--g1);color:#fff;display:grid;place-items:center;
 font-weight:700;font-size:16px}
.hello b{font-size:17px;font-weight:700}
.hello i{font-style:normal;font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);
 font-size:15px;color:var(--ink);flex:none}
.maintabs{display:flex;background:#ECEBE4;border-radius:999px;padding:4px;margin-top:16px}
.maintabs button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);
 padding:10px;border-radius:999px}
.maintabs button.on{background:var(--g1);color:#fff;box-shadow:0 3px 10px rgba(15,61,46,.25)}

.qbar{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);
 border-radius:999px;padding:5px 6px 5px 17px;box-shadow:var(--sh);margin-top:14px}
.qbar input{flex:1;min-width:0;border:0;margin:0;padding:11px 0;background:none;font:inherit;font-size:14px;
 border-radius:0}
.qbar input:focus{outline:none}
.qbar input::placeholder{color:#A9B2AD}
.qi{width:34px;height:34px;border-radius:50%;border:0;background:none;font-size:16px;color:var(--mut);flex:none}
.qgo{width:40px;height:40px;border-radius:50%;border:0;background:var(--g1);color:#fff;font-size:16px;
 flex:none;margin-left:3px;display:grid;place-items:center;line-height:1}
.qgo.rec{background:var(--red);animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(.9);opacity:.75}}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.sec{margin-top:20px}
.sechead{display:flex;align-items:center;margin-bottom:11px}
.sechead h2{font-size:15.5px;font-weight:700}
.sechead .more{margin-left:auto;font-size:12px;color:var(--mut)}
.big{font-size:32px;font-weight:800;letter-spacing:-.035em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pair .card .v{font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.trio .card{padding:13px}
.trio .v{font-size:17px;font-weight:700;margin-top:5px}

.subs{display:flex;gap:7px;overflow-x:auto;margin-top:14px;padding-bottom:3px}
.subs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;
 font:inherit;font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.subs button.on{background:var(--g1);color:#fff;border-color:var(--g1)}

.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:17px;flex:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;font-size:11.5px;color:var(--mut);display:block;margin-top:2px}
.amt{font-size:14.5px;font-weight:700;white-space:nowrap}
.red{color:var(--red)}.grn{color:var(--g2)}
.bar{height:6px;background:#EFEEE8;border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.22,1,.36,1)}

.ban{display:flex;align-items:flex-start;gap:11px;background:var(--mint);border:1px solid #D2E8DC;
 border-radius:17px;padding:13px 15px;margin-top:13px;font-size:13px;line-height:1.5;color:#17543E}
.ban.warn{background:#FCF0EE;border-color:#F0D5D1;color:#8E2F27}
.ban.amber{background:#FDF5E7;border-color:#F0E2C4;color:#7A5410}
.ban.plain{background:var(--card);border-color:var(--line);color:var(--mut)}
.ban b{font-weight:700}
.ban .ic{font-size:17px;flex:none;line-height:1.3}

.ask{background:var(--g1);color:#fff;border-radius:20px;padding:16px;margin-top:13px}
.ask .q{font-size:14.5px;line-height:1.5;font-weight:500}
.ask .btns{display:flex;gap:9px;margin-top:13px}
.ask .btns button{flex:1;border:0;border-radius:12px;padding:11px;font:inherit;font-size:13px;font-weight:700}
.yes{background:#fff;color:var(--g1)}
.no{background:rgba(255,255,255,.17);color:#fff}
.later{background:rgba(255,255,255,.17);color:#fff;flex:0 0 72px!important}

.day{border:1px solid var(--line);border-radius:18px;background:var(--card);margin-top:11px;overflow:hidden;
 box-shadow:var(--sh)}
.dh{display:flex;align-items:center;gap:9px;padding:13px 15px;background:#FAFAF6;border-bottom:1px solid var(--line)}
.dh b{font-size:13.5px;font-weight:700}
.dh i{font-style:normal;font-size:11px;color:var(--mut)}
.dh .t{margin-left:auto;font-size:17px;font-weight:800;letter-spacing:-.02em}
.db{padding:3px 15px 9px}
.cl{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cl b{font-size:12.5px;font-weight:600;flex:none}
.cl span.bits{flex:1;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl span.a{font-size:13.5px;font-weight:700}

.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.leg div b{margin-left:auto;color:var(--ink);font-weight:700}

.meal{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:11px;overflow:hidden;
 box-shadow:var(--sh)}
.mh{display:flex;align-items:center;gap:11px;padding:13px 15px}
.mh .tile{width:36px;height:36px;border-radius:11px;font-size:16px}
.mh b{font-size:14px;font-weight:700}
.mh i{font-style:normal;font-size:11px;color:var(--mut);display:block;margin-top:2px}
.mh .k{margin-left:auto;font-size:15px;font-weight:800;white-space:nowrap}
.mh .add{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
 font-size:15px;color:var(--ink);flex:none;margin-left:4px}
.mb{padding:0 15px 11px}
.fi{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px}
.fi .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .fk{font-weight:700;font-size:12.5px}
.x{width:24px;height:24px;border-radius:50%;border:0;background:#F2F1EB;color:var(--mut);font-size:13px;flex:none}
.thumb{width:28px;height:28px;border-radius:7px;object-fit:cover;flex:none}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,246,241,.96);backdrop-filter:blur(14px);
 border-top:1px solid var(--line);display:flex;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;border:0;background:none;font:inherit;font-size:10px;color:#9FA8A3;display:grid;gap:4px;
 justify-items:center;font-weight:600}
nav button .g{font-size:17px;line-height:1}
nav button.on{color:var(--g1)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom));
 width:54px;height:54px;border-radius:50%;border:4px solid var(--bg);background:var(--g1);color:#fff;
 font-size:25px;line-height:1;box-shadow:0 8px 22px rgba(15,61,46,.35);z-index:31}

.sheet{position:fixed;inset:0;background:rgba(10,24,19,.45);z-index:50;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sbox{background:var(--bg);width:100%;max-width:440px;margin:0 auto;border-radius:24px 24px 0 0;
 padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.22,1,.36,1);
 max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(50px);opacity:.3}}
.grab{width:36px;height:4px;background:#DCDBD3;border-radius:99px;margin:0 auto 14px}
h3{font-size:19px;font-weight:700}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;font:inherit;
 margin-top:10px;background:var(--card);color:var(--ink)}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g1);color:#fff;font:inherit;
 font-weight:700;margin-top:13px}
.go.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.go.red{background:#FCF0EE;color:#8E2F27}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;font:inherit;font-size:12.5px}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}

.bub{max-width:84%;padding:11px 14px;border-radius:17px;font-size:13.5px;line-height:1.5;
 margin-top:9px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{background:var(--g1);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bub.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;
 box-shadow:var(--sh)}
.bubimg{width:92px;height:92px;object-fit:cover;border-radius:11px;margin-top:7px}
.didit{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;
 color:var(--g2);font-weight:600;line-height:1.7}
.typing{display:flex;gap:4px;align-items:center;width:58px}
.typing span{width:6px;height:6px;border-radius:50%;background:#BFC6C2;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{40%{opacity:.25}}
.vo{position:fixed;inset:0;background:rgba(10,24,19,.86);z-index:70;display:none;flex-direction:column;
 align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff}
.vo.on{display:flex}
.vo .orb{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;
 font-size:36px;animation:breathe 1.4s infinite}
@keyframes breathe{50%{transform:scale(1.12);background:rgba(255,255,255,.26)}}
.vo .txt{margin-top:22px;font-size:17px;line-height:1.5;min-height:52px;max-width:330px}
.vo .hint{margin-top:10px;font-size:12px;opacity:.6;max-width:300px;line-height:1.5}
.vo .stop{margin-top:26px;border:0;border-radius:999px;background:#fff;color:var(--g1);font:inherit;
 font-weight:700;padding:13px 30px}
/* streaks */
.strow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.strk{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px 9px;
 text-align:center;box-shadow:var(--sh)}
.strk .fl{font-size:18px;display:block;line-height:1}
.strk b{display:block;font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.02em}
.strk i{font-style:normal;display:block;font-size:9.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.strk.live{background:linear-gradient(160deg,#0F3D2E,#1C6B4F);border-color:transparent;color:#fff}
.strk.live i{color:rgba(255,255,255,.7)}
.strk.cold{opacity:.75}
.pips{display:flex;gap:3px;justify-content:center;margin-top:7px}
.pips span{width:6px;height:6px;border-radius:50%;background:#E4E3DC}
.pips span.y{background:var(--g3)}
.strk.live .pips span{background:rgba(255,255,255,.25)}
.strk.live .pips span.y{background:#9FD9BC}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.calhd{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.calhd b{font-size:14px;font-weight:700;flex:1;text-align:center}
.calhd button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
 font-size:15px;color:var(--ink);flex:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{font-size:9.5px;color:var(--mut);text-align:center;font-weight:600;padding-bottom:3px}
.cd{aspect-ratio:1;border:0;background:none;border-radius:11px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;color:var(--ink);padding:0}
.cd.pad{visibility:hidden}
.cd .pd{width:5px;height:5px;border-radius:50%;background:transparent}
.cd.good{background:var(--mint);font-weight:700}
.cd.good .pd{background:var(--g2)}
.cd.over{background:#FCF0EE;font-weight:700;color:#8E2F27}
.cd.over .pd{background:var(--red)}
.cd.part{background:#F3F2EC}
.cd.part .pd{background:var(--mut)}
.cd.now{box-shadow:inset 0 0 0 2px var(--g1)}
.callegend{display:flex;gap:12px;margin-top:11px;font-size:10.5px;color:var(--mut);flex-wrap:wrap}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend i{width:8px;height:8px;border-radius:50%;display:block}

/* animated donut + macro row */
.sl{stroke-dasharray:0 var(--c);animation:sweep .9s cubic-bezier(.3,1,.4,1) forwards}
@keyframes sweep{to{stroke-dasharray:var(--l) var(--c)}}
.ctr{animation:pop .5s .34s cubic-bezier(.22,1.3,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(5px)}}
.macro{display:flex;gap:9px;margin-top:12px}
.macro>div{flex:1;background:#FAFAF6;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.macro b{display:block;font-size:17px;font-weight:800;margin-top:3px}
.inst{display:flex;align-items:center;gap:11px;background:var(--g1);color:#fff;border-radius:18px;
 padding:14px 15px;margin-top:14px}
.inst .ic{font-size:19px;flex:none}
.inst .tx{flex:1;font-size:12.5px;line-height:1.45}
.inst button{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-size:12.5px;font-weight:700;
 background:#fff;color:var(--g1);flex:none}
.inst .skip{background:rgba(255,255,255,.17);color:#fff;padding:10px 11px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab">+</button>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>
<div class="vo" id="vo">
  <div class="orb">&#127897;</div>
  <div class="txt" id="votxt">Listening…</div>
  <div class="hint" id="vohint"></div>
  <button class="stop" onclick="stopListening()">Done</button>
</div>
<input type="file" id="cam" accept="image/*" style="display:none">

function load(){
 try{var raw=localStorage.getItem(KEY);
  if(!raw)raw=localStorage.getItem(KEY+'.bak');
  if(!raw){
   var old=localStorage.getItem('momentum.v2');
   if(old){var o=JSON.parse(old),s=clone(SEED);
    Object.keys(o).forEach(function(k){if(s[k]!==undefined)s[k]=o[k];});
    Object.keys(SEED.health).forEach(function(j){if(s.health[j]===undefined)s.health[j]=SEED.health[j];});
    s.settings.ready=1;
    return s;}
   return clone(SEED);}
  var d;
  try{d=JSON.parse(raw);}catch(e){d=JSON.parse(localStorage.getItem(KEY+'.bak')||'null');}
  if(!d||!d.accounts)throw new Error('empty');
  Object.keys(SEED).forEach(function(k){
   if(d[k]===undefined)d[k]=clone(SEED[k]);
   else if(k==='health'||k==='settings'||k==='ai')
    Object.keys(SEED[k]).forEach(function(j){if(d[k][j]===undefined)d[k][j]=SEED[k][j];});
  });
  /* someone who already has data never sees the welcome screen */
  if(!d.settings.ready&&((d.tx||[]).length||(d.debts||[]).length||(d.accounts||[]).length>1||
     Object.keys(d.food||{}).length))d.settings.ready=1;
  return d;}catch(e){return clone(SEED);}
}
function clone(x){return JSON.parse(JSON.stringify(x));}

}
function canUndo(){return !!(UNDO&&Date.now()-UNDO.at<10*60*1000);}
function undo(){

}

/* A second copy in IndexedDB. Android clears a site's storage when space runs low or
   the site looks unused; two stores in two places rarely go at the same moment. */
function idbOpen(cb){
 try{
  var r=indexedDB.open('momentum',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
  r.onsuccess=function(){cb(r.result);};
  r.onerror=function(){cb(null);};
 }catch(e){cb(null);}
}
function idbPut(json){
 idbOpen(function(db){
  if(!db)return;
  try{db.transaction('kv','readwrite').objectStore('kv').put({json:json,at:Date.now()},'snapshot');}
  catch(e){}
 });
}
function idbGet(cb){
 idbOpen(function(db){
  if(!db)return cb(null);
  try{
   var q=db.transaction('kv','readonly').objectStore('kv').get('snapshot');
   q.onsuccess=function(){cb(q.result||null);};
   q.onerror=function(){cb(null);};
  }catch(e){cb(null);}
 });
}
/* Ask Android to stop evicting us. An installed app is almost always granted this. */
function keepStorage(){
 try{
  if(navigator.storage&&navigator.storage.persist)
   navigator.storage.persisted().then(function(ok){if(!ok)navigator.storage.persist();});
 }catch(e){}
}
/* If localStorage came back empty but a snapshot survived, put it back without asking. */
function rescue(){
 if(D.settings.ready)return;
 idbGet(function(rec){
  if(!rec||!rec.json)return;
  try{
   var d=JSON.parse(rec.json);
   if(!d.settings||!d.settings.ready)return;
   D=d;
   Object.keys(SEED).forEach(function(k){if(D[k]===undefined)D[k]=clone(SEED[k]);});
   save();chrome(true);draw();
   toast('Your data was recovered from the backup copy on this phone.');
  }catch(e){}
 });
}

/* ---------- helpers ---------- */
function N(n){return Math.round(Math.abs(n)).toLocaleString('en-IN');}
function R(n){return '₹'+N(n);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function col(c){return (CC[c]||CC.Other)[0];}
function ico(c){return (CC[c]||CC.Other)[1];}
function p2(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function ym(){return today().slice(0,7);}
function dayAgo(n){var d=new Date();d.setDate(d.getDate()-n);
 return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function dshort(d){return new Date(d+'T12:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function monthName(){return new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
function acc(id){return D.accounts.filter(function(a){return a.id===id;})[0]||D.accounts[0];}
function src(id){return D.sources.filter(function(s){return s.id===id;})[0]||D.sources[D.sources.length-1];}
function ordinal(n){if(n>3&&n<21)return 'th';return ['th','st','nd','rd'][n%10]||'th';}
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ================= FINANCE MODEL ================= */
function balance(id){
 var b=acc(id).open;
 D.tx.forEach(function(t){
  if(t.type==='in'&&t.acct===id)b+=t.amount;
  else if(t.type==='out'&&t.acct===id)b-=t.amount;
  else if(t.type==='lend'&&t.acct===id)b-=t.amount;
  else if(t.type==='repay'&&t.acct===id)b+=t.amount;
  else if(t.type==='move'){if(t.from===id)b-=t.amount;if(t.to===id)b+=t.amount;}});
 return b;
}
function liquid(){return D.accounts.reduce(function(s,a){return s+balance(a.id);},0);}
function inDay(d){return D.tx.filter(function(t){return t.date===d&&t.type==='in';})
 .reduce(function(s,t){return s+t.amount;},0);}
function outDay(d){return D.tx.filter(function(t){return t.date===d&&t.type==='out';})
 .reduce(function(s,t){return s+t.amount;},0);}
function range(span){
 if(span==='day')return [today(),today()];
 if(span==='week')return [dayAgo(6),today()];
 if(span==='month')return [ym()+'-01',today()];
 return [dayAgo(29),today()];
}
function txIn(span,type){
 var r=range(span);
 return D.tx.filter(function(t){return t.date>=r[0]&&t.date<=r[1]&&(!type||t.type===type);});
}
function sum(l){return l.reduce(function(s,t){return s+t.amount;},0);}
function groupBy(list,key){
 var by={};list.forEach(function(t){var k=t[key]||'Other';by[k]=(by[k]||0)+t.amount;});
 return Object.keys(by).map(function(k){return {name:k,value:by[k]};})
  .sort(function(a,b){return b.value-a.value;});
}
function debtStats(d){
 var paid=Math.max(0,(d.total||0)-(d.left||0));
 var months=d.emi>0?Math.ceil(d.left/d.emi):null;
 var span=months==null?'no monthly amount':months<=1?'final payment':
  months<12?months+' months left':
  (Math.floor(months/12)+' yr'+(months%12?' '+(months%12)+' mo':'')+' left');
 var end=null;
 if(months){var e=new Date();e.setMonth(e.getMonth()+months);
  end=e.toLocaleDateString('en-IN',{month:'short',year:'numeric'});}
 return {paid:paid,pct:d.total?Math.round(paid/d.total*100):0,months:months,span:span,end:end};
}
var CLOSE_HOLD=2*60*60*1000;   /* a closed debt stays visible, marked Closed, for two hours */
function liveDebts(){return D.debts.filter(function(d){return !d.closed;});}
function holdingDebts(){return D.debts.filter(function(d){
 return d.closed&&Date.now()-d.closed<CLOSE_HOLD;});}
function clearedDebts(){return D.debts.filter(function(d){
 return d.closed&&Date.now()-d.closed>=CLOSE_HOLD;});}
function closeDebt(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];if(!d||d.closed)return;
 if(!confirm('Close '+d.name+' by paying the remaining '+R(d.left)+' now?'))return;
 var amt=d.left,tid=nid();
 if(amt>0)D.tx.push({id:tid,date:today(),amount:amt,type:'out',cat:'Debt',
  note:d.name+' \u2014 closed',acct:D.accounts[0].id});
 d.closedAmount=amt;d.closedTx=tid;d.closed=Date.now();d.left=0;
 var m=ym();D.paid[m]=D.paid[m]||{};
 if(!D.paid[m][id])D.paid[m][id]={date:today(),txid:tid,amount:0};
 save();draw();
 toast(d.name+' closed. '+R(amt)+' recorded \u2014 it leaves the list in two hours.');
}
function reopenDebt(id){
 var d=D.debts.filter(function(x){return x.id===id;})[0];if(!d||!d.closed)return;

function intoAcct(id,d){
 return D.tx.filter(function(t){return t.type==='move'&&t.to===id&&(!d||t.date===d);})
  .reduce(function(x,t){return x+t.amount;},0);
}

function potMonths(p){
 if(!p.target||!p.daily)return null;
 var left=p.target-potSaved(p);

 return Math.ceil(left/(p.daily*30));
}

/* ================= PARSING ================= */
function clean(t){
 return String(t||'').toLowerCase().replace(/[!?;:]/g,' ')
  .replace(/[.,]/g,function(m,off,s){
   var p=s.charAt(off-1),n=s.charAt(off+1);
   return (/\d/.test(p)&&/\d/.test(n))?m:' ';})
  .replace(/\s+/g,' ').trim();
}
function numBefore(txt,at){
 var pre=txt.slice(Math.max(0,at-22),at);
 var m=pre.match(/([\d]+(?:\.\d+)?)\s*$/);
 if(m)return Number(m[1]);
 m=pre.match(new RegExp('([\\d]+(?:\\.\\d+)?)\\s+(?:'+UNITW+')\\s*$'));
 if(m)return Number(m[1]);
 var ws=pre.trim().split(' ');
 var w=ws[ws.length-1];
 if(NUMW[w]!==undefined)return NUMW[w];
 if(new RegExp('^(?:'+UNITW+')$').test(w)&&ws.length>1&&NUMW[ws[ws.length-2]]!==undefined)
  return NUMW[ws[ws.length-2]];
 return null;
}
function parseFoodText(text){
 var t=clean(text),found=[],used=[];
 FIDX.forEach(function(e){
  var at=0;
  while(true){
   var i=t.indexOf(e.n,at);
   if(i<0)break;
   at=i+e.n.length;
   var okL=i===0||!/[a-z஀-௿]/.test(t.charAt(i-1));
   var okR=at>=t.length||!/[a-z஀-௿]/.test(t.charAt(at));
   if(!okL||!okR)continue;
   var clash=used.some(function(u){return i<u[1]&&at>u[0];});
   if(clash)continue;
   used.push([i,at]);
   var f=FOODS[e.i],q=numBefore(t,i);
   found.push({pos:i,name:f[0],qty:q==null?f[4]:q,unit:f[3],per:f[2],pro:f[5]||0});
  }
 });
 found.sort(function(a,b){return a.pos-b.pos;});
 /* whatever the table could not account for */
 var rest=t,i2;
 var ranges=used.slice().sort(function(x,y){return y[0]-x[0];});
 for(i2=0;i2<ranges.length;i2++)
  rest=rest.slice(0,ranges[i2][0])+' '+rest.slice(ranges[i2][1]);
 rest=rest.replace(/[\d.,]+/g,' ').split(' ').filter(function(w){
  if(!w||w.length<3)return false;
  if(NUMW[w]!==undefined)return false;
  if(new RegExp('^(?:'+UNITW+')$').test(w))return false;
  return !/^(and|with|some|the|ate|eat|had|have|today|morning|evening|night|plus|also|for|breakfast|lunch|dinner|snack|snacks|tiffin|\u0b9a\u0bbe\u0baa\u0bcd\u0baa\u0bbf\u0b9f\u0bcd\u0b9f\u0bc7\u0ba9\u0bcd|\u0b89\u0ba3\u0bb5\u0bc1|\u0bae\u0bb1\u0bcd\u0bb1\u0bc1\u0bae\u0bcd)$/.test(w);
 }).join(' ').trim();
 found.leftover=rest;
 return found;
}
function mealFromText(text){
 var t=clean(text);
 if(/breakfast|காலை|kaalai|tiffin|டிபன்/.test(t))return 'breakfast';
 if(/lunch|மதிய|madhiya|mathiya/.test(t))return 'lunch';
 if(/dinner|இரவு|iravu|night/.test(t))return 'dinner';
 if(/snack|ஸ்நாக்|evening|மாலை/.test(t))return 'snacks';
 return null;
}
function parseActivity(text){
 var t=clean(text),m;
 m=t.match(/(?:steps?|அடி|நடை)\s*([\d,]+)/)||t.match(/([\d,]+)\s*(?:steps?|அடி)/);
 if(m)return {kind:'steps',value:Number(m[1].replace(/,/g,''))};
 m=t.match(/(?:treadmill|டிரெட்மில்)\s*([\d.]+)/)||t.match(/([\d.]+)\s*(?:min|mins|minutes)\s*(?:treadmill|டிரெட்மில்)/);
 if(m)return {kind:'treadmill',value:Number(m[1])};
 m=t.match(/(?:walk|walked|walking|நடந்தேன்|nadanthen)\s*(?:for\s*)?([\d.]+)/)
  ||t.match(/([\d.]+)\s*(?:min|mins|minutes|நிமிடம்|நிமிடங்கள்)\s*(?:walk|நடந்தேன்)/);
 if(m)return {kind:'walk',value:Number(m[1])};
 m=t.match(/(?:swim|swimming|நீச்சல்)\s*([\d.]+)/);
 if(m)return {kind:'swim',value:Number(m[1])};

var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, recText='';
/* A phone can only listen in one language at a time, so the app chooses for him:
   it starts from the phone's own language and quietly switches when it stops understanding. */
function voiceLang(){
 if(D.settings.lang==='ta')return 'ta-IN';
 if(D.settings.lang==='en')return 'en-IN';
 if(D.settings.heard==='ta')return 'ta-IN';
 if(D.settings.heard==='en')return 'en-IN';
 return /^ta/i.test(navigator.language||'')?'ta-IN':'en-IN';
}
function heardOk(){D.settings.heard=voiceLang()==='ta-IN'?'ta':'en';D.settings.misses=0;save();}
function heardMiss(){
 D.settings.misses=(D.settings.misses||0)+1;
 if(D.settings.misses>=2&&D.settings.lang==='auto'){
  D.settings.heard=voiceLang()==='ta-IN'?'en':'ta';D.settings.misses=0;save();return true;}
 save();return false;
}

var AI_TRY=['gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash'];
function hasKey(){return !!(D.ai.key&&D.ai.key.length>10);}
/* Inside Claude's artifact frame the browser blocks every call to an outside service.
   Served from an ordinary web address, or opened as a file, the same call goes through. */
function blocked(){
 try{return /claude\.ai|anthropic/i.test(location.hostname)||
  (location.ancestorOrigins&&location.ancestorOrigins.length>0);}catch(e){return false;}
}
var GBASE='https://generativelanguage.googleapis.com/v1beta/';

/* Google renames its models often, so rather than hard-coding one, ask the key which
   models it can actually use and keep the answer. */
function pickModel(cb){
 if(D.ai.model)return cb(D.ai.model,null);
 var first=!D.ai.qp;
 fetch(GBASE+'models?pageSize=200'+(D.ai.qp?('&key='+encodeURIComponent(D.ai.key)):''),
   D.ai.qp?{}:{headers:{'x-goog-api-key':D.ai.key}})
  .then(function(r){
   return r.text().then(function(t){
    /* some keys are only accepted as a query parameter - try that once before giving up */
    if(!r.ok&&r.status===400&&first&&/API_KEY_INVALID|not valid/i.test(t)){
     D.ai.qp=1;save();throw new Error('__qp__');}
    if(!r.ok)throw new Error(apiErr(r.status,t));
    return JSON.parse(t);});})
  .then(function(j){
   var ok=(j.models||[]).filter(function(m){
     return (m.supportedGenerationMethods||[]).indexOf('generateContent')>-1;})
    .map(function(m){return String(m.name).replace('models/','');})
    .filter(function(n){return !/embed|aqa|tts|image-gen|imagen|veo|native-audio|live/i.test(n);});
   var flash=ok.filter(function(n){return /flash/.test(n)&&!/thinking|lite|8b/i.test(n);});
   var chosen=null,i;
   for(i=0;i<AI_TRY.length&&!chosen;i++)
    if(ok.indexOf(AI_TRY[i])>-1)chosen=AI_TRY[i];
   chosen=chosen||flash[0]||ok[0];
   if(!chosen)return cb(null,'The key works, but no usable model is enabled on it.');
   D.ai.model=chosen;save();cb(chosen,null);
  })
  .catch(function(e){
   if(e&&e.message==='__qp__')return pickModel(cb);
   cb(null,netErr(e));});
}
function apiErr(status,text){
 var msg='';
 try{msg=(JSON.parse(text).error||{}).message||'';}catch(e){}
 if(status===400&&/API key not valid|API_KEY_INVALID/i.test(msg))
  return 'Google does not recognise this key. Usually the paste was cut short, or the key was '+
   'deleted in AI Studio. Check the length shown under AI key, then make a fresh one.';
 if(status===403)
  return 'Google refused the key. Open aistudio.google.com/apikey and check it is still there, '+
   'and that the Generative Language API is on for its project.';
 if(status===429)
  return 'You have hit the free daily limit. Try again tomorrow.';
 return 'Google said: '+(msg||('HTTP '+status));
}
function netErr(e){
 var m=(e&&e.message)||'';
 if(/failed to fetch|networkerror|load failed/i.test(m))
  return blocked()
   ? 'This page cannot call Google from inside Claude. Open the installed app instead.'
   : 'Could not reach Google. Check the connection and try again.';
 return m||'Something went wrong talking to Google.';
}
function gemini(parts,cb){
 if(!hasKey())return cb(null,'no-key');
 pickModel(function(model,err){
  if(!model)return cb(null,err);
  var url=GBASE+'models/'+model+':generateContent'+(D.ai.qp?('?key='+encodeURIComponent(D.ai.key)):'');
  var head={'Content-Type':'application/json'};
  if(!D.ai.qp)head['x-goog-api-key']=D.ai.key;
  fetch(url,{
   method:'POST',
   headers:head,
   body:JSON.stringify({contents:[{parts:parts}],
    generationConfig:{responseMimeType:'application/json',temperature:0.2}})
  }).then(function(r){
   return r.text().then(function(t){
    if(r.status===404){D.ai.model='';save();throw new Error('__retry__');}
    if(!r.ok)throw new Error(apiErr(r.status,t));
    return JSON.parse(t);});
  }).then(function(j){
   var c=(j.candidates||[])[0]||{};
   var txt=(((c.content||{}).parts||[{}])[0]||{}).text||'';
   if(!txt&&c.finishReason)throw new Error('The AI stopped early ('+c.finishReason+').');
   try{cb(JSON.parse(txt),null);}
   catch(e){cb(null,'The AI replied in a shape the app could not read.');}
  }).catch(function(e){
   if(e&&e.message==='__retry__')return gemini(parts,cb);
   cb(null,netErr(e));
  });
 });
}

   var c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);

  var full=render(900,0.72),thumb=render(110,0.5);

function monthlyIncome(){

  var d=new Date(),m;
  d.setMonth(d.getMonth()-i);
  m=d.getFullYear()+'-'+p2(d.getMonth()+1);
  var got=D.tx.filter(function(t){return t.type==='in'&&t.date.slice(0,7)===m;})
   .reduce(function(x,t){return x+t.amount;},0);

function payoffOrder(){

  var am=a.emi?Math.ceil(a.left/a.emi):999, bm=b.emi?Math.ceil(b.left/b.emi):999;
  if(am!==bm)return am-bm;
  return a.left-b.left;});

  var ar=a.left?(a.emi||0)/a.left:0, br=b.left?(b.emi||0)/b.left:0;
  return br-ar;});

}

function togglePaid(id,silent){
 var m=ym();D.paid[m]=D.paid[m]||{};
 var o=dues().filter(function(x){return x.id===id;})[0];if(!o)return;
 mark((D.paid[m][id]?'unticking ':'ticking off ')+o.name);
 if(D.paid[m][id]){
  if(!silent&&!confirm('Mark '+o.name+' as unpaid again?'))return;
  var rc=D.paid[m][id];
  D.tx=D.tx.filter(function(t){return t.id!==rc.txid;});
  var dd=D.debts.filter(function(x){return x.id===id;})[0];
  if(dd)dd.left=dd.left+(rc.amount||0);
  delete D.paid[m][id];
 }else{
  var tid=nid();
  D.tx.push({id:tid,date:today(),amount:o.amount,type:'out',cat:o.kind==='debt'?'Debt':'Bills',
   note:o.name,acct:D.accounts[0].id});
  var d2=D.debts.filter(function(x){return x.id===id;})[0];
  if(d2)d2.left=Math.max(0,d2.left-o.amount);
  D.paid[m][id]={date:today(),txid:tid,amount:o.amount};
 }
 save();draw();
}

/* ================= STREAKS ================= */
function streakOf(test){
 var n=0,i=0,live=test(today());
 if(!live)i=1;
 while(i<400){if(!test(dayAgo(i)))break;n++;i++;}
 return {n:n,live:live,risk:!live&&n>0};
}
function last7(test){var a=[];for(var i=6;i>=0;i--)a.push(test(dayAgo(i)));return a;}
var TESTS={
 food:   function(d){return foodOf(d).length>0;},
 onPlan: function(d){return foodOf(d).length>0&&eaten(d)<=eatTarget();},
 moved:  function(d){return actOf(d).length>0;},
 money:  function(d){return D.tx.some(function(t){return t.date===d;});},
 saved:  function(d){return pots().some(function(p){return intoAcct(p.acct,d)>0;});},
 income: function(d){return inDay(d)>0;}
};
function strkCard(test,label,icon,key){
 var st=streakOf(test),pips=last7(test);
 return '<div class="strk '+(st.live&&st.n?'live':st.n?'cold':'')+'"'+
  (key?' onclick="streakSheet(\''+key+'\')"':'')+'>'+
  '<span class="fl">'+(st.n?icon:'\u00B7')+'</span><b>'+st.n+'</b><i>'+label+'</i>'+
  '<div class="pips">'+pips.map(function(y){return '<span class="'+(y?'y':'')+'"></span>';}).join('')+
  '</div></div>';
}
function strkNudge(test,what,verb){
 var st=streakOf(test);
 if(st.risk&&st.n>=2)
  return '<div class="ban amber"><span class="ic">\uD83D\uDD25</span><div>Your <b>'+st.n+'-day '+what+
   ' streak</b> is still alive \u2014 '+verb+' today and it carries on.</div></div>';
 if(st.live&&st.n>=7&&st.n%7===0)
  return '<div class="ban"><span class="ic">\uD83C\uDFC6</span><div><b>'+st.n+' days straight.</b> That is '+
   (st.n/7)+' full week'+(st.n/7>1?'s':'')+' without breaking it.</div></div>';
 if(st.live&&st.n>=3)
  return '<div class="ban"><span class="ic">\uD83D\uDD25</span><div><b>'+st.n+
   ' days in a row.</b> Do not break it tomorrow.</div></div>';
 return '';
}

/* ===== streak detail, longest run, missed days ===== */
var STREAKS={
 food:  {t:'food',  label:'days logged',  icon:'\uD83D\uDD25', what:'logging a meal'},
 onPlan:{t:'onPlan',label:'days on target',icon:'\uD83C\uDFAF', what:'staying inside your calories'},
 moved: {t:'moved', label:'days moving',  icon:'\u26A1',       what:'moving'},
 money: {t:'money', label:'days logged',  icon:'\uD83D\uDD25', what:'logging your money'},
 income:{t:'income',label:'earning days', icon:'\uD83D\uDCB0', what:'bringing something in'},
 saved: {t:'saved', label:'days saved',   icon:'\uD83C\uDFAF', what:'putting money aside'}
};
function longestRun(test,days){
 var best=0,run=0;
 for(var i=(days||120)-1;i>=0;i--){
  if(test(dayAgo(i))){run++;if(run>best)best=run;}else run=0;
 }
 return best;
}
function runTotal(test,days){
 var n=0;
 for(var i=0;i<(days||30);i++)if(test(dayAgo(i)))n++;
 return n;
}
function streakSheet(key){
 var S=STREAKS[key];if(!S)return;
 var test=TESTS[S.t],st=streakOf(test);
 var best=longestRun(test),last30=runTotal(test,30);
 var missed=[];
 for(var i=1;i<30&&missed.length<6;i++)if(!test(dayAgo(i)))missed.push(dayAgo(i));
 var grid='';
 for(var j=29;j>=0;j--){
  var d=dayAgo(j),on=test(d);
  grid+='<div title="'+d+'" style="aspect-ratio:1;border-radius:5px;background:'+
   (on?(j===0?'var(--g1)':'var(--g3)'):'#EDECE5')+'"></div>';
 }
 openSheet('<div class="grab"></div><h3>'+S.icon+' '+st.n+' '+S.label+'</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:4px">'+
   (st.live?'Today is already counted.':st.n?'Still alive \u2014 but today is not done yet.':
    'No run going right now.')+'</div>'+
  '<div class="macro" style="margin-top:14px">'+
   '<div><div class="mic">Now</div><b>'+st.n+'</b><div style="font-size:10px;color:var(--mut)">days</div></div>'+
   '<div><div class="mic">Longest</div><b>'+best+'</b><div style="font-size:10px;color:var(--mut)">days</div></div>'+
   '<div><div class="mic">Last 30</div><b>'+last30+'</b><div style="font-size:10px;color:var(--mut)">days</div></div>'+
  '</div>'+
  '<div class="mic" style="margin-top:18px">Last 30 days</div>'+
  '<div style="display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:9px">'+grid+'</div>'+
  (missed.length?'<div class="mic" style="margin-top:18px">Days you missed</div>'+
   '<div style="font-size:12.5px;color:var(--mut);margin-top:7px;line-height:1.7">'+
   missed.map(function(d){return dshort(d);}).join('<br>')+'</div>':
   '<div class="ban" style="margin-top:16px"><span class="ic">\uD83C\uDFC6</span><div>'+
   'Not one missed day in the last month.</div></div>')+
  (!st.live?'<div class="ban amber"><span class="ic">\uD83D\uDD25</span><div>'+

/* a run that just ended, so it gets said once rather than quietly dropped */
function brokenBanner(keys){
 var out='';
 keys.forEach(function(k){
  var S=STREAKS[k],test=TESTS[S.t];
  if(test(today())||test(dayAgo(1)))return;
  var had=0;
  for(var i=2;i<200;i++){if(test(dayAgo(i)))had++;else break;}
  if(had<3)return;
  if(D.answered['broke:'+k+':'+today()])return;
  out+='<div class="ban warn"><span class="ic">\uD83D\uDCA2</span><div>'+
   '<b>Your '+had+'-day run of '+S.what+' ended.</b> Nothing yesterday, nothing yet today. '+
   'Do one small thing now and the count starts again.'+
   ' <span style="text-decoration:underline" onclick="D.answered[\'broke:'+k+':\'+today()]=1;save();draw()">'+
   'Dismiss</span></div></div>';
 });
 return out;
}

/* every action the assistant is allowed to take, applied here rather than trusted blindly */
function runActions(list,thumb){
 if(!list||!list.length)return [];
 mark('what the assistant just did');
 var out=[],d=today();
 list.forEach(function(a){
  try{
   if(a.a==='food'&&(a.items||[]).length){
    var meal=MEALS.some(function(m){return m.id===a.meal;})?a.meal:mealNow();
    var k=0,p=0;
    a.items.forEach(function(it){
     var kc=Number(it.kcal)||0,pr=Number(it.protein_g)||0;
     k+=kc;p+=pr;
     addFood(d,meal,it.name||'Food',Number(it.qty)||1,it.unit||'serving',kc,thumb,pr);
     thumb=null;});
    out.push('\u2713 '+a.items.map(function(it){
     return ((Number(it.qty)||1)!==1?(Number(it.qty)||1)+' ':'')+String(it.name||'').toLowerCase();
    }).join(', ')+' \u2014 '+Math.round(k)+' kcal, '+Math.round(p)+'g into '+meal);
   }
   else if(a.a==='spend'&&a.amount){
    D.tx.push({id:nid(),date:d,amount:Number(a.amount),type:'out',
     cat:CATS.indexOf(a.category)>-1?a.category:'Other',note:a.note||'',acct:D.accounts[0].id});
    out.push('\u2713 '+R(a.amount)+' out \u2014 '+(a.note||a.category||'other'));
   }
   else if(a.a==='earn'&&a.amount){
    D.tx.push({id:nid(),date:d,amount:Number(a.amount),type:'in',src:src(a.source).id,
     note:a.note||'',acct:D.accounts[0].id,mins:Number(a.mins)||0});
    out.push('\u2713 '+R(a.amount)+' in from '+src(a.source).name);
   }
   else if(a.a==='activity'&&a.value){
    var kind=a.what==='steps'?'steps':(METS[a.what]?a.what:'walk');
    var kk=actKcal({kind:kind,value:Number(a.value)});
    addAct(d,kind,Number(a.value),kk);
    out.push('\u2713 '+actLabel({kind:kind,value:Number(a.value)})+' \u2014 '+kk+' kcal');
   }
   else if(a.a==='weight'&&a.value){hSet(d,'weight',Number(a.value));
    out.push('\u2713 weight '+a.value+' kg');}
   else if(a.a==='water'&&a.ml){hSet(d,'water',waterOf(d)+Number(a.ml));
    out.push('\u2713 '+a.ml+' ml water');}
   else if(a.a==='editfood'&&a.id){
    var f=null,day=null;
    Object.keys(D.food).forEach(function(k2){
     (D.food[k2]||[]).forEach(function(x){if(x.id===a.id){f=x;day=k2;}});});
    if(f){
     if(a.qty){
      var pk=f.qty?f.kcal/f.qty:f.kcal, pp=f.qty?(f.pro||0)/f.qty:(f.pro||0);
      f.qty=Number(a.qty);f.kcal=Math.round(pk*f.qty);f.pro=Math.round(pp*f.qty*10)/10;
     }
     if(a.kcal)f.kcal=Math.round(Number(a.kcal));
     if(a.protein_g)f.pro=Math.round(Number(a.protein_g)*10)/10;
     if(a.meal&&MEALS.some(function(m){return m.id===a.meal;}))f.meal=a.meal;
     out.push('\u2713 '+f.name+' is now '+f.qty+' \u2014 '+f.kcal+' kcal');
    }
   }
   else if(a.a==='delfood'&&a.id){
    var nm='';
    Object.keys(D.food).forEach(function(k2){
     D.food[k2]=(D.food[k2]||[]).filter(function(x){
      if(x.id===a.id){nm=x.name;return false;} return true;});});
    if(nm)out.push('\u2713 removed '+nm);
   }
   else if(a.a==='paid'&&a.id){
    if(!isPaid(a.id)){togglePaid(a.id,true);out.push('\u2713 ticked off');}
   }
   else if(a.a==='unpaid'&&a.id){
    if(isPaid(a.id)){togglePaid(a.id,true);out.push('\u2713 put back as unpaid');}
   }
   else if(a.a==='fuel'&&a.km){
    var fr=addFuel(a.km,a.rupees,a.litres);
    if(fr)out.push('\u2713 petrol '+R(fr.rupees)+' at '+N(a.km)+' km');
   }
   else if(a.a==='odo'&&a.km){
    setOdo(d,a.when==='end'?'end':'start',a.km);
    out.push('\u2713 odometer '+(a.when==='end'?'end':'start')+' '+N(a.km)+' km'+
     (kmOn(d)?' \u2014 '+N(kmOn(d))+' km today':''));
   }
   else if(a.a==='lend'&&a.amount&&a.who){
    addLent(a.who,Number(a.amount),D.accounts[0].id,'');
    out.push('\u2713 '+R(a.amount)+' to '+a.who);
   }
   else if(a.a==='lentback'&&a.who){
    var lb=(D.lent||[]).filter(function(x){return !x.back&&
     String(x.who).toLowerCase()===String(a.who).toLowerCase();})[0];
    if(lb){markBack(lb.id);out.push('\u2713 '+lb.who+' paid back');}
   }
   else if(a.a==='save'&&a.amount){
    var pot=pots().filter(function(x){return x.id===a.pot||x.name===a.pot;})[0];
    if(pot){
     var from=D.accounts.filter(function(x){return x.id!==pot.acct;})
      .sort(function(x,y){return balance(y.id)-balance(x.id);})[0];
     if(from){addSaving(pot.id,Number(a.amount),from.id);
      out.push('\u2713 '+R(a.amount)+' into '+pot.name);}
    }
   }
  }catch(e){}
 });
 save();
 return out;
}

var DIAG=[];

    .map(function(m){return String(m.name).replace('models/','');});

/* ===== fingerprint, using the phone's own hardware =====
   The phone proves it is him; nothing about the fingerprint ever reaches the app. */
function bioAvailable(cb){
 if(!window.PublicKeyCredential||!navigator.credentials||location.protocol!=='https:')return cb(false);
 try{
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
   .then(function(ok){cb(!!ok);}).catch(function(){cb(false);});
 }catch(e){cb(false);}
}
function b64(buf){
 var b='',a=new Uint8Array(buf);
 for(var i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);
 return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
function bioRegister(){
 bioAvailable(function(ok){
  if(!ok)return toast('This phone has no fingerprint or face unlock available to the browser.');
  navigator.credentials.create({publicKey:{
   challenge:rnd(32),
   rp:{name:'Momentum'},
   user:{id:rnd(16),name:(D.settings.name||'me')+'@momentum',
    displayName:D.settings.name||'Momentum'},
   pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
   authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',
    residentKey:'preferred'},
   timeout:60000
  }}).then(function(cred){
   D.settings.bio=b64(cred.rawId);
   save();closeSheet();draw();
   toast('Fingerprint on. Your PIN still works if it ever fails.');
  }).catch(function(e){
   toast(e&&e.name==='NotAllowedError'?'Cancelled.':'Could not set it up on this phone.');
  });
 });
}
function bioPrompt(){
 if(!D.settings.bio)return;
 var raw=D.settings.bio.replace(/-/g,'+').replace(/_/g,'/');
 var bin=atob(raw),arr=new Uint8Array(bin.length);
 for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 navigator.credentials.get({publicKey:{
  challenge:rnd(32),
  allowCredentials:[{type:'public-key',id:arr.buffer}],
  userVerification:'required',timeout:60000
 }}).then(function(){
  window._unlocked=1;chrome(true);draw();
 }).catch(function(){
  var m=document.getElementById('pin_msg');
  if(m)m.textContent='Fingerprint not recognised \u2014 use the PIN.';
 });
}

/* ================= THE BIKE =================
   Tank-to-tank mileage: the distance covered on a tankful, divided by the litres
   that went in at the START of that stretch. That is the only honest way to measure it. */
function fuels(){return (D.fuel||[]).slice().sort(function(a,b){return a.km-b.km;});}
function petrolPrice(){return D.settings.petrol||107.76;}
function litresOf(f){
 if(f.litres)return f.litres;
 return f.rupees&&f.price?Math.round(f.rupees/f.price*100)/100:0;
}
function addFuel(km,rupees,litres,note){
 km=Number(km)||0;
 if(!km)return toast('I need the odometer reading.');
 var last=fuels()[fuels().length-1];
 if(last&&km<last.km)return toast('That reading is lower than the last one ('+N(last.km)+' km).');
 mark('that fill-up');
 var price=petrolPrice();
 var rec={id:nid(),date:today(),km:km,
  rupees:Number(rupees)||(litres?Math.round(litres*price):0),
  litres:Number(litres)||0,price:price,note:note||''};
 D.fuel=(D.fuel||[]).concat([rec]);
 if(rec.rupees)D.tx.push({id:nid(),date:today(),amount:rec.rupees,type:'out',cat:'Fuel',
  note:'Petrol at '+N(km)+' km',acct:D.accounts[0].id,fuelId:rec.id});
 save();
 var st=fuelStats();
 var msg=R(rec.rupees)+' petrol at '+N(km)+' km';
 if(st.last)msg+=' \u2014 last tank gave '+st.last.kmpl+' km/l';
 draw();toast(msg);
 return rec;
}
function fuelStats(){
 var f=fuels(),legs=[];
 for(var i=1;i<f.length;i++){
  var prev=f[i-1],cur=f[i];
  var dist=cur.km-prev.km, lit=litresOf(prev);
  if(dist>0&&lit>0)
   legs.push({from:prev.km,to:cur.km,dist:dist,litres:lit,
    kmpl:Math.round(dist/lit*10)/10,
    cost:prev.rupees,
    perKm:Math.round(prev.rupees/dist*100)/100,
    date:cur.date});
 }
 var totDist=legs.reduce(function(x,l){return x+l.dist;},0);
 var totLit=legs.reduce(function(x,l){return x+l.litres;},0);
 var spent=f.reduce(function(x,r){return x+(r.rupees||0);},0);
 return {legs:legs,last:legs[legs.length-1]||null,
  avg:totLit?Math.round(totDist/totLit*10)/10:0,
  totDist:totDist,spent:spent,
  perKm:totDist?Math.round(spent/totDist*100)/100:0,
  fills:f.length};
}
/* odometer at the start and end of a day, for days he just rides */
function odo(d){return (D.odo||{})[d]||null;}
function setOdo(d,which,km){
 D.odo=D.odo||{};
 D.odo[d]=D.odo[d]||{};
 D.odo[d][which]=Number(km)||0;
 save();
}
function kmOn(d){
 var o=odo(d);
 if(o&&o.start&&o.end&&o.end>=o.start)return o.end-o.start;
 return 0;
}
function kmIn(span){
 var r=range(span),tot=0;
 Object.keys(D.odo||{}).forEach(function(d){
  if(d>=r[0]&&d<=r[1])tot+=kmOn(d);});
 return tot;
}

 }

function fuelEcho(fromLitres){
 var p=petrolPrice();
 var rs=document.getElementById('fu_rs'),l=document.getElementById('fu_l'),
     e=document.getElementById('fu_echo');

  if(Number(l.value))rs.value=Math.round(Number(l.value)*p);
 }else{
  if(Number(rs.value))l.value=Math.round(Number(rs.value)/p*100)/100;
 }
 e.textContent=(Number(l.value)||0)+' litres at \u20B9'+p+' a litre.';

/* ================= MONEY LENT TO PEOPLE =================
   Not spending. It leaves the account but it is still yours, so it sits in its own list
   and comes back when they pay. */
function lents(){return (D.lent||[]).slice().sort(function(a,b){
 if(!!a.back!==!!b.back)return a.back?1:-1;
 return a.date<b.date?1:-1;});}
function lentOut(){return (D.lent||[]).filter(function(l){return !l.back;})
 .reduce(function(x,l){return x+l.amount;},0);}
function addLent(who,amount,acct,note){
 if(!who||!amount)return;
 mark('lending '+who+' '+R(amount));
 var id=nid(),tid=nid();
 D.lent=(D.lent||[]).concat([{id:id,who:who,amount:amount,date:today(),note:note||'',
  acct:acct,txid:tid,back:null}]);
 D.tx.push({id:tid,date:today(),amount:amount,type:'lend',acct:acct,
  note:'Lent to '+who,lentId:id});
 save();draw();
 toast(R(amount)+' to '+who+' \u2014 in the list until it comes back.');
}
function markBack(id,amount){
 var l=(D.lent||[]).filter(function(x){return x.id===id;})[0];if(!l)return;
 mark(l.who+' paying back');
 var amt=amount||l.amount;
 l.back=today();l.backAmount=amt;
 var tid=nid();
 l.backTx=tid;
 D.tx.push({id:tid,date:today(),amount:amt,type:'repay',acct:l.acct,
  note:l.who+' paid back',lentId:id});
 save();draw();
 toast(l.who+' paid back '+R(amt)+'.');
}
function unBack(id){

 mark('undoing that repayment');
 D.tx=D.tx.filter(function(t){return t.id!==l.backTx;});
 l.back=null;l.backAmount=0;l.backTx=null;

}

/* ===== repeat what you already eat ===== */
function favFoods(n){
 var tally={};
 for(var i=0;i<60;i++){
  foodOf(dayAgo(i)).forEach(function(f){
   var k=f.name;
   tally[k]=tally[k]||{name:f.name,n:0,qty:f.qty,unit:f.unit,kcal:f.kcal,pro:f.pro||0};
   tally[k].n++;
  });
 }
 return Object.keys(tally).map(function(k){return tally[k];})
  .sort(function(a,b){return b.n-a.n;}).slice(0,n||8);
}
function addFav(name,meal){

 draw();toast(f.name+' added \u2014 '+Math.round(f.kcal)+' kcal');

 mark('copying that meal');

}

function calRing(pct,ok){
 var r=36,c=2*Math.PI*r;
 return '<svg viewBox="0 0 88 88" width="88" height="88" style="flex:none">'+
  '<circle cx="44" cy="44" r="'+r+'" fill="none" stroke="rgba(255,255,255,.17)" stroke-width="9"/>'+
  '<circle cx="44" cy="44" r="'+r+'" fill="none" stroke="'+(ok?'#7FC3A3':'#E8897F')+'" stroke-width="9"'+
  ' stroke-linecap="round" stroke-dasharray="'+(c*pct/100).toFixed(1)+' '+c.toFixed(1)+
  '" transform="rotate(-90 44 44)"/>'+
  '<text x="44" y="49" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">'+pct+'%</text></svg>';
}
function spark(vals){
 var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),rg=Math.max(0.5,max-min);
 var pts=vals.map(function(v,i){return (i/(vals.length-1)*280).toFixed(1)+','+
  (84-(v-min)/rg*64-10).toFixed(1);}).join(' ');
 return '<svg viewBox="0 0 280 90" style="width:100%"><polyline points="'+pts+
  '" fill="none" stroke="var(--g2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
  '<text x="0" y="12" font-size="10" fill="#7E8A84">'+max+' kg</text>'+
  '<text x="243" y="88" font-size="10" fill="#7E8A84">'+vals[vals.length-1]+' kg</text></svg>';
}

function saveEntry(){
 var amount=Number(document.getElementById('amt').value);
 if(!amount||amount<=0)return alert('Enter an amount first.');
 var k=document.getElementById('extra').dataset.kind;
 var note=(document.getElementById('note')||{}).value||'';
 if(k==='lend'){
  var who=((document.getElementById('lw')||{}).value||'').trim();
  if(!who)return toast('Who did you give it to?');
  addLent(who,amount,document.getElementById('acct').value,note);
  closeSheet();return;
 }
 if(k==='move'){
  var f=document.getElementById('from').value,t2=document.getElementById('to').value;
  if(f===t2)return alert('Pick two different accounts.');
  D.tx.push({id:nid(),date:today(),amount:amount,type:'move',from:f,to:t2,note:note});
 }else if(k==='in')
  D.tx.push({id:nid(),date:today(),amount:amount,type:'in',
   src:document.getElementById('srcsel').value,note:note,acct:document.getElementById('acct').value});
 else
  D.tx.push({id:nid(),date:today(),amount:amount,type:'out',
   cat:document.getElementById('cat').value,note:note,acct:document.getElementById('acct').value});
 save();closeSheet();draw();
}

function saveTx(id){
 var t=D.tx.filter(function(x){return x.id===id;})[0];if(!t)return;
 var amt=Number((document.getElementById('e_amt')||{}).value);
 if(!amt||amt<=0)return toast('The amount has to be more than zero.');
 mark('the change to '+(t.note||t.cat||'that entry'));
 t.amount=amt;
 t.note=((document.getElementById('e_note')||{}).value||'').trim();
 var d=(document.getElementById('e_date')||{}).value;
 if(d)t.date=d;
 if(t.type==='out'){t.cat=(document.getElementById('e_cat')||{}).value;
  t.acct=(document.getElementById('e_acct')||{}).value;}
 else if(t.type==='in'){t.src=(document.getElementById('e_src')||{}).value;
  t.acct=(document.getElementById('e_acct')||{}).value;}
 else{
  var f=(document.getElementById('e_from')||{}).value,o=(document.getElementById('e_to')||{}).value;
  if(f===o)return toast('Pick two different accounts.');
  t.from=f;t.to=o;
 }
 save();closeSheet();draw();toast('Saved.');
}
function delTx(id){
 var t=D.tx.filter(function(x){return x.id===id;})[0];
 if(!confirm('Delete this entry?'))return;
 mark('deleting '+((t&&(t.note||t.cat))||'that entry'));
 Object.keys(D.paid).forEach(function(m){
  Object.keys(D.paid[m]).forEach(function(k){
   if(D.paid[m][k].txid===id){
    var dd=D.debts.filter(function(x){return x.id===k;})[0];
    if(dd)dd.left=dd.left+(D.paid[m][k].amount||0);
    delete D.paid[m][k];
   }});});
 D.tx=D.tx.filter(function(x){return x.id!==id;});
 save();closeSheet();draw();toast('Deleted.');
}

function qtyEcho(){

function backupFile(){
 try{
  var blob=new Blob([JSON.stringify(D)],{type:'application/json'});
  var name='momentum-backup-'+today()+'.json';
  var f=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   navigator.share({files:[f],title:name}).then(function(){
    D.settings.backedUp=today();save();}).catch(function(){});
   return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
  D.settings.backedUp=today();save();
  toast('Saved to your downloads.');
 }catch(e){toast('Could not make the file \u2014 use Copy my data instead.');}
}

function backupAge(){
 if(!D.settings.backedUp)return 999;
 return Math.round((new Date(today())-new Date(D.settings.backedUp))/864e5);
}
function backupNag(){
 if(!D.settings.ready)return '';
 var n=backupAge();
 if(n<10)return '';
 return '<div class="ban amber"><span class="ic">⚑</span><div>'+
  (n>900?'<b>You have never taken a backup.</b>':'<b>Last backup was '+n+' days ago.</b>')+
  ' If this phone clears its storage, everything here goes with it. '+
  '<span style="text-decoration:underline" onclick="backupFile()">Take one now</span>.</div></div>';
}

 openSheet('<div class="grab"></div><h3>Restore</h3>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-top:4px">This replaces everything here.</div>'+
  '<textarea id="imp" rows="8" style="font-size:11px" placeholder="Paste your backup"></textarea>'+

function doImport(first){
 try{
  var raw=(document.getElementById('imp')||{}).value||'';
  var d=JSON.parse(raw);
  if(!d.accounts||!d.tx)throw new Error('That does not look like a Momentum backup.');
  D=d;
  Object.keys(SEED).forEach(function(k){
   if(D[k]===undefined)D[k]=clone(SEED[k]);
   else if(k==='health'||k==='settings'||k==='ai')
    Object.keys(SEED[k]).forEach(function(j){if(D[k][j]===undefined)D[k][j]=SEED[k][j];});});
  D.settings.ready=1;
  save();closeSheet();chrome(true);draw();
  toast(first?'Restored \u2014 everything is back.':'Backup restored.');
 }catch(e){alert('Could not restore: '+e.message);}
}

function toastUndo(msg){toast(msg,1);}
function toast(msg,undoable){
 var t=document.createElement('div');
 if(undoable&&canUndo()){
  t.innerHTML='<span></span><button style="border:0;background:rgba(255,255,255,.2);color:#fff;'+
   'font:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:9px;margin-left:11px">'+
   'Undo</button>';
  t.firstChild.textContent=msg;
  t.lastChild.onclick=function(e){e.stopPropagation();undo();t.remove();};
 }else t.textContent=msg;
 t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:122px;background:#15201B;'+
  'color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;'+
  'box-shadow:0 8px 24px rgba(0,0,0,.22);max-width:90vw;text-align:center;line-height:1.4;'+
  'display:flex;align-items:center;justify-content:center';
 document.body.appendChild(t);
 setTimeout(function(){t.style.transition='opacity .3s';t.style.opacity='0';
  setTimeout(function(){t.remove();},320);},undoable?5200:2400);
}

paintNav();draw();
